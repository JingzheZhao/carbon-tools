<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Carbon Tools</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --card:#ffffff; --cardLine:#d6dde3; --track:#eef2f6; --field:#ffffff; --knob:#fff;
  --bar:rgba(252,253,254,.92); --shadow:0 2px 10px rgba(22,32,42,.08),0 1px 3px rgba(22,32,42,.05);
  --text:#1c2530; --sub:#5a6875; --dim:#8c98a5; --accentText:#0a6f6a; --line:#e2e9f0; --selBg:#dcf0ee; --ochreBg:#f6efe0;
  --accent:#0d8c86; --accentInk:#0a6f6a; --green:#2f7d5b; --ochre:#b8862b; --ochreInk:#8a6a2b; --red:#a4344e;
  --scene:#ffffff; --grid1:#ccd5dd; --grid2:#e3e9ee;
  --r-shell:12px; --r-surface:9px; --r-ctrl:6px; --r-pill:999px;
  --fs-display:22px; --fs-figure:19px; --fs-strong:13px;
  --fs-body:12px; --fs-meta:10.5px; --fs-label:9px;
  --tabLift:0 -2px 6px rgba(22,32,42,.07);
  --cardLift:0 1px 2px rgba(22,32,42,.055);
  --cardLiftHover:0 3px 10px rgba(22,32,42,.10),0 1px 3px rgba(22,32,42,.06);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
[data-t="dark"]{
  --card:#161e25; --cardLine:#28323b; --track:#1c252d; --field:#111920; --knob:#2c3841;
  --bar:rgba(13,20,26,.92); --shadow:0 4px 16px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.35);
  --text:#e4e9ef; --sub:#9aa7b5; --dim:#6f7d8b; --accentText:#55e8d6; --line:#222e3a; --selBg:#123330; --ochreBg:#3a2f18;
  --accent:#33ccbd; --accentInk:#6ff0e2; --green:#4aa87c; --ochre:#e6b35c; --ochreInk:#f2ca80; --red:#d4707f;
  --scene:#1e2732; --grid1:#4a5a6e; --grid2:#384555;
  --tabLift:0 -2px 7px rgba(0,0,0,.42);
  --cardLift:0 1px 2px rgba(0,0,0,.38);
  --cardLiftHover:0 3px 12px rgba(0,0,0,.52),0 1px 3px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--scene);color:var(--text);font-family:var(--sans);font-size:var(--fs-strong);line-height:1.5;-webkit-font-smoothing:antialiased}
.m{font-family:var(--mono)}
button,input,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:rgba(120,120,120,.35);border-radius:var(--r-surface)}
::-webkit-scrollbar-track{background:transparent}

#viewport{position:fixed;inset:0}
#viewport canvas{display:block}

.bar{position:fixed;left:0;right:0;top:0;height:46px;z-index:40;display:flex;align-items:center;gap:16px;
  padding:0 14px;background:var(--bar);border-bottom:1px solid var(--cardLine);backdrop-filter:blur(6px)}
.wm{font-family:var(--mono);font-size:var(--fs-strong);font-weight:600;letter-spacing:.14em}
.wmv{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.1em;color:var(--dim)}
.spacer{flex:1}
.syncerr{font-family:var(--mono);font-size:var(--fs-meta);color:var(--red);display:flex;align-items:center;gap:7px}
.syncerr[hidden]{display:none}   /* an author display rule beats the hidden attribute */
.syncerr::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
.themeseg{display:flex;gap:2px;background:var(--track);border-radius:var(--r-ctrl);padding:2px}
.themeseg button{width:26px;height:24px;border:0;background:none;border-radius:var(--r-ctrl);cursor:pointer;
  color:var(--dim);display:flex;align-items:center;justify-content:center}
.themeseg button:hover{color:var(--sub)}
.themeseg button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.acct{position:relative}
.avatar{width:28px;height:28px;border-radius:50%;border:1px solid var(--cardLine);background:var(--track);
  font-family:var(--mono);font-size:var(--fs-meta);font-weight:600;color:var(--sub);cursor:pointer;
  display:flex;align-items:center;justify-content:center;letter-spacing:.04em}
.avatar:hover{border-color:var(--accent);color:var(--accentInk)}
.menu{position:absolute;right:0;top:36px;min-width:186px;background:var(--card);
  border:1px solid var(--cardLine);border-radius:var(--r-surface);box-shadow:var(--shadow);padding:6px;z-index:50}
.mhead{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--dim);
  padding:6px 8px 8px;border-bottom:1px solid var(--line)}
.msec{padding:9px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--line)}
.mlabel{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--dim)}
.mseg{display:flex;background:var(--track);border-radius:var(--r-ctrl);padding:2px;gap:2px}
.mseg button{border:0;background:none;padding:4px 9px;border-radius:var(--r-pill);font-size:var(--fs-meta);
  color:var(--sub);cursor:pointer;font-family:var(--sans)}
.mseg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.mitem{width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:var(--r-ctrl);
  font-size:var(--fs-body);color:var(--text);cursor:pointer;font-family:var(--sans);margin-top:4px}
.mitem:hover{background:var(--track)}

.tb{position:fixed;right:14px;top:58px;z-index:35;display:flex;flex-direction:column;gap:3px;
  background:var(--card);border:1px solid var(--cardLine);border-radius:var(--r-ctrl);
  padding:3px;box-shadow:var(--cardLift)}
.tb-btn{width:30px;height:30px;border:0;background:none;border-radius:var(--r-ctrl);cursor:pointer;
  color:var(--dim);display:flex;align-items:center;justify-content:center}
.tb-btn:hover{background:var(--track);color:var(--sub)}
.tb-btn[aria-pressed="true"]{background:var(--selBg);color:var(--accentText)}
.tb-sep{height:1px;background:var(--line);margin:2px 4px}
.tb-pop{position:absolute;right:calc(100% + 6px);width:180px;background:var(--card);
  border:1px solid var(--cardLine);border-radius:var(--r-surface);box-shadow:var(--cardLiftHover);
  padding:7px;display:flex;flex-direction:column;gap:2px}
.tb-pop[hidden]{display:none}   /* an author display rule outranks the attribute */
.tb-ttl{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.07em;color:var(--dim);
  padding:2px 4px 6px}
.tb-opt{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;
  padding:5px;border-radius:var(--r-ctrl);font-family:var(--sans);font-size:var(--fs-body);
  color:var(--sub);text-align:left}
.tb-opt:hover{background:var(--track)}
.tb-opt[aria-pressed="true"]{background:var(--selBg);color:var(--accentText);font-weight:600}
.tb-sw{width:46px;height:10px;border-radius:var(--r-pill);flex:none}
.tb-pop.wide{width:342px}
.tb-row{display:flex;align-items:center;gap:8px;padding:5px 4px 5px 6px;border-radius:var(--r-ctrl)}
.tb-row:hover{background:var(--track)}
.tb-row.now{background:var(--selBg)}
.tb-row .nm{flex:1;min-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--sans);font-size:var(--fs-body);color:var(--text);text-align:left;
  border:0;background:none;cursor:pointer;padding:0}
.tb-row.now .nm{color:var(--accentText);font-weight:600}
.tb-row .fig{font-family:var(--mono);font-size:var(--fs-meta);color:var(--sub);white-space:nowrap}
.tb-row .dlt{font-family:var(--mono);font-size:var(--fs-label);white-space:nowrap;width:44px;text-align:right}
.tb-row .up{color:var(--ochreInk)} .tb-row .dn{color:var(--green)}
.tb-row .del{border:0;background:none;color:var(--dim);cursor:pointer;font-size:14px;
  line-height:1;padding:0 2px;opacity:0}
.tb-row:hover .del{opacity:1}
.tb-row .del:hover{color:var(--red)}
.tb-new{display:flex;gap:5px;padding:7px 4px 2px;border-top:1px solid var(--line);margin-top:5px}
.tb-new input{flex:1;min-width:0;background:var(--field);border:1px solid var(--cardLine);
  border-radius:var(--r-ctrl);padding:5px 7px;font-family:var(--sans);font-size:var(--fs-body);
  color:var(--text)}
.tb-new button{border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
  border-radius:var(--r-ctrl);padding:5px 10px;font-family:var(--sans);font-size:var(--fs-body);
  font-weight:600}
.tb-msg{font-family:var(--sans);font-size:var(--fs-meta);color:var(--dim);padding:2px 4px 6px;
  line-height:1.5}
.dm-bar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:35;width:max-content}
.dm-seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--cardLine);
  border-radius:var(--r-ctrl);padding:3px;box-shadow:var(--shadow)}
.dm-seg button{border:0;background:none;padding:6px 15px;border-radius:var(--r-ctrl);cursor:pointer;
  font-family:var(--sans);font-size:var(--fs-body);font-weight:500;color:var(--dim)}
.dm-seg button:hover{color:var(--sub)}
.dm-seg button[aria-pressed="true"]{background:var(--selBg);color:var(--accentText);font-weight:600}
.dm-ramp{position:fixed;left:512px;bottom:22px;z-index:35;
  display:flex;flex-direction:row;align-items:stretch;gap:6px}
.dm-ramp[hidden]{display:none}   /* an author display rule outranks the attribute */
.dm-grad{width:9px;height:210px;border-radius:var(--r-pill);flex:none}
.dm-scale{position:relative;height:210px;font-family:var(--mono);
  font-size:var(--fs-label);color:var(--dim);white-space:nowrap}
.dm-scale span{position:absolute;left:0;padding-left:7px;line-height:1}
.dm-scale span.dm-hi{top:0}
.dm-scale span.dm-lo{bottom:0}
.dm-scale span.dm-lab{color:var(--sub);font-weight:500}
.dm-note{font-family:var(--mono);font-size:var(--fs-label);color:var(--dim);text-align:center;line-height:1.5}
.leftcol{position:fixed;left:12px;top:58px;bottom:16px;z-index:25;width:462px;
  display:flex;flex-direction:column;gap:10px}

.project{background:var(--card);border:1px solid var(--cardLine);border-radius:var(--r-shell);
  box-shadow:var(--shadow);padding:9px 12px 10px;flex:none;position:relative;z-index:30}
.setup .fld .pickbox.ms{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:40}
.prow{display:flex;align-items:baseline;gap:10px}
.period{font-family:var(--mono);font-size:var(--fs-label);color:var(--dim);white-space:nowrap}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:7px}
.setup .fld{min-width:0;position:relative}
.setup label{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.11em;color:var(--dim);display:block;margin-bottom:3px;text-transform:uppercase}

.panel{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--cardLine);border-radius:var(--r-shell);box-shadow:var(--shadow);overflow:hidden}
/* folder tabs: the strip is a recessed trough, and the active tab rises out of
   it in the body's own colour so the two read as one continuous surface */
.tabs{display:flex;justify-content:space-between;gap:6px;padding:6px 14px 0;background:var(--track);
  border-bottom:1px solid var(--cardLine)}
.tabs button{flex:1 1 0;max-width:112px;position:relative;padding:7px 8px 9px;cursor:pointer;
  border:0;border-radius:var(--r-surface) var(--r-surface) 0 0;
  background:transparent;
  font-size:var(--fs-body);font-weight:500;color:var(--dim);
  display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button:hover{color:var(--sub)}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--accentText);font-weight:600;z-index:2;
  margin-bottom:-1px;box-shadow:var(--tabLift)}

/* the bottom corners flare outward with a concave sweep, the way a real folder
   tab meets its baseline. border-radius only curves inward, so each corner is a
   small square of card colour with a quarter disc masked out of it. */
.tabs button[aria-pressed="true"]::before,
.tabs button[aria-pressed="true"]::after{
  content:"";position:absolute;bottom:0;width:var(--r-surface);height:var(--r-surface);
  background:var(--card);pointer-events:none}
.tabs button[aria-pressed="true"]::before{
  left:calc(var(--r-surface) * -1);
  -webkit-mask:radial-gradient(circle var(--r-surface) at 0 0,transparent var(--r-surface),#000 var(--r-surface));
          mask:radial-gradient(circle var(--r-surface) at 0 0,transparent var(--r-surface),#000 var(--r-surface))}
.tabs button[aria-pressed="true"]::after{
  right:calc(var(--r-surface) * -1);
  -webkit-mask:radial-gradient(circle var(--r-surface) at 100% 0,transparent var(--r-surface),#000 var(--r-surface));
          mask:radial-gradient(circle var(--r-surface) at 100% 0,transparent var(--r-surface),#000 var(--r-surface))}
.badge{font-family:var(--mono);font-size:var(--fs-label);background:var(--selBg);color:var(--accent);border-radius:var(--r-pill);padding:1px 7px}
.body{flex:1;overflow-y:auto}

.syncnote{font-size:var(--fs-body);color:var(--sub);line-height:1.6;background:var(--track);border:1px solid var(--line);
  border-radius:var(--r-surface);padding:10px 12px;margin-bottom:12px}
.syncnote b{color:var(--text);font-weight:600}
.cg{border:1px solid var(--cardLine);border-radius:var(--r-surface);padding:11px 12px;margin-bottom:10px;
  background:var(--card);box-shadow:var(--cardLift);transition:box-shadow .16s ease}
.cg:hover{box-shadow:var(--cardLiftHover)}
@media (prefers-reduced-motion:reduce){.cg{transition:none}}
.cghead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.cgsw{width:15px;height:15px;border-radius:var(--r-pill);border:1px solid rgba(0,0,0,.2);flex:none;cursor:pointer}
.cgid{font-size:var(--fs-strong);font-weight:600;letter-spacing:.02em;font-family:var(--mono);color:var(--accentText)}
.cgvis{margin-left:auto;font-size:var(--fs-meta);color:var(--dim);cursor:pointer;background:none;border:0;text-decoration:underline;text-underline-offset:2px}
.cgq{font-family:var(--mono);font-size:var(--fs-body);color:var(--sub);margin-bottom:8px;line-height:1.55}
.cgq b{color:var(--sub);font-weight:500}
.cgsel{width:100%;padding:7px 9px;border:1px solid var(--cardLine);border-radius:var(--r-ctrl);background:var(--field);font-size:var(--fs-body)}
.pick{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--cardLine);
  border-radius:var(--r-ctrl);background:var(--field);font-size:var(--fs-body);cursor:pointer;text-align:left;color:var(--text)}
.pick span:first-child{flex:1;line-height:1.35;text-align:left}
.pick.none span:first-child{color:var(--dim)}
.pick .chev{color:var(--dim);font-size:var(--fs-meta)}
.pickbox{margin-top:6px;border:1px solid var(--cardLine);border-radius:var(--r-surface);background:var(--card);overflow:hidden}
.picksearch{width:100%;padding:8px 10px;border:0;border-bottom:1px solid var(--line);
  background:var(--field);font-size:var(--fs-body);color:var(--text)}
.picksearch:focus{outline:none;border-bottom-color:var(--accent)}
.picklist{max-height:280px;overflow-y:auto}
.pickgroup{position:sticky;top:0;background:var(--card);font-family:var(--mono);font-size:var(--fs-label);
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:7px 10px 4px;border-bottom:1px solid var(--line)}
.pickopt{width:100%;display:flex;gap:8px;align-items:baseline;padding:7px 10px;border:0;background:none;
  cursor:pointer;text-align:left;font-size:var(--fs-body);line-height:1.35;color:var(--text)}
.pickopt:hover{background:var(--track)}
.pickopt.sel{background:var(--selBg);color:var(--accentInk)}
.pickopt .lbl{flex:1}
.pickopt .mt{font-family:var(--mono);font-size:var(--fs-meta);color:var(--dim);white-space:nowrap}

.cgres{display:flex;align-items:baseline;gap:10px;margin-top:9px}
.cgval{font-family:var(--mono);font-size:var(--fs-display);font-weight:600;letter-spacing:-.5px;color:var(--accentText)}
.cgexp{border:0;background:none;padding:0;cursor:pointer;font-size:var(--fs-meta);color:var(--dim);
  margin-left:auto;text-decoration:underline;text-underline-offset:2px}
.cgexp:hover{color:var(--accent)}
.cgcost{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.cgcost .cur{font-family:var(--mono);font-size:var(--fs-body);color:var(--dim)}
.cgcost input{width:78px;padding:5px 8px;border:1px solid var(--cardLine);border-radius:var(--r-ctrl);
  background:var(--field);font-family:var(--mono);font-size:var(--fs-body);text-align:right}
.cgcost .per{font-family:var(--mono);font-size:var(--fs-meta);color:var(--dim)}
.cgcost .tot{margin-left:auto;font-family:var(--mono);font-size:var(--fs-body);font-weight:600}

.pv{font-family:var(--mono);font-size:var(--fs-meta);border-radius:var(--r-ctrl);padding:2px 7px;white-space:nowrap}
.pv.m{color:var(--accentInk);border:1px solid var(--accent);background:var(--selBg)}
.pv.ok{color:var(--green);border:1px solid var(--green);background:transparent}
.pv.no{color:var(--dim);border:1px solid var(--line);background:transparent}
.pv.a{color:var(--ochreInk);border:1px dashed var(--ochre);background:var(--ochreBg)}
.grp{margin-top:14px}
.grphead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grphead .l{display:flex;align-items:center;gap:8px}
.grphead .n{font-size:var(--fs-meta);color:var(--dim)}
.grphead .t{font-family:var(--mono);font-size:var(--fs-meta)}
.item{border-bottom:1px solid var(--line)}
.itemrow{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:start;padding:8px 2px;
  cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--text)}
.itemrow .nm{font-size:var(--fs-body);line-height:1.35}
.itemrow .q{font-family:var(--mono);font-size:var(--fs-meta);color:var(--sub);margin-top:3px}
.itemrow .v{font-family:var(--mono);font-size:var(--fs-body);text-align:right}
.detail{background:var(--track);border-radius:var(--r-surface);padding:10px 11px;margin:0 2px 9px;font-size:var(--fs-meta);color:var(--sub);line-height:1.55}
.upg{margin-top:8px;padding:7px 9px;border:1px dashed var(--ochre);background:var(--ochreBg);
  border-radius:var(--r-ctrl);font-size:var(--fs-meta);color:var(--ochreInk);line-height:1.5}
.totrow{margin-top:16px;display:flex;align-items:baseline;justify-content:space-between;padding-top:10px;border-top:1.5px solid var(--text)}
.totrow .l{font-size:var(--fs-body);font-weight:500}
.totrow .v{font-family:var(--mono);font-size:var(--fs-figure);font-weight:600;color:var(--accentText)}
.totnote{font-size:var(--fs-meta);color:var(--dim);margin-top:5px;line-height:1.5}
.empty{padding:24px 16px;text-align:center;color:var(--dim);font-size:var(--fs-body);line-height:1.7}

.meta{font-family:var(--mono);font-size:var(--fs-meta);color:var(--dim)}
.h2{margin-top:14px;font-size:var(--fs-figure);font-weight:700;letter-spacing:-.3px}
.sub2{font-size:var(--fs-body);color:var(--sub);line-height:1.55;margin-top:4px}
.findings{margin-top:16px;padding:13px 14px;border-radius:var(--r-surface);background:var(--track);border:1px solid var(--line)}
.findings .k{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.1em;color:var(--dim);margin-bottom:7px}
.findings .x{font-size:var(--fs-body);line-height:1.65}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.kpi{border:1px solid var(--line);border-radius:var(--r-surface);padding:11px 12px}
.kpi .k{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.08em;color:var(--dim)}
.kpi .v{font-family:var(--mono);font-size:var(--fs-display);font-weight:600;letter-spacing:-.5px;margin-top:3px}
.kpi .r{font-family:var(--mono);font-size:var(--fs-label);color:var(--dim);margin-top:5px}

.project .warn{margin-top:8px;padding:8px 10px;border-radius:var(--r-ctrl);border:1px solid var(--red);

<!-- Dataset and material table are served by the plugin from data/*.json,
     so the repository versions them once instead of twice. -->
<script src="/data/cc.js"></script>
<script src="/data/materials.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   PART 1 — three.js viewer.  Kept as-is from the original viewer.html:
   same r128 build, OrbitControls, lighting, grid, Z-up→Y-up convention,
   mesh building and /data.json polling.
   ═══════════════════════════════════════════════════════════════ */
var viewport = document.getElementById('viewport');
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 100000);
camera.position.set(20, 20, 20);

var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
viewport.appendChild(renderer.domElement);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
// match Rhino: right-drag orbits, middle zooms, left pans
controls.mouseButtons = {
  LEFT:   THREE.MOUSE.PAN,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT:  THREE.MOUSE.ROTATE
};

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
var sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(10, 20, 10);
scene.add(sun);
var grid = new THREE.GridHelper(200, 40, 0xccd5dd, 0xe3e9ee);
scene.add(grid);

var contentGroup = new THREE.Group();
scene.add(contentGroup);

window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();

// Rhino is Z-up, right-handed. three.js is Y-up, right-handed.
function toThree(p){ return new THREE.Vector3(p[0], p[2], -p[1]); }

function buildGeometry(meshData){
  var geometry = new THREE.BufferGeometry(), positions = [];
  meshData.faces.forEach(function(face){
    var a=meshData.vertices[face[0]], b=meshData.vertices[face[1]], c=meshData.vertices[face[2]];
    pushTriangle(positions,a,b,c);
    if(face.length===4) pushTriangle(positions,a,c,meshData.vertices[face[3]]);
  });
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  geometry.computeVertexNormals();
  return geometry;
}
function pushTriangle(positions,a,b,c){
  [a,b,c].forEach(function(v){ var p=toThree(v); positions.push(p.x,p.y,p.z); });
}
/* Two option studies are only comparable if they are photographed from the same
   place, which a free orbit camera cannot promise. 'top' and 'axo' are fixed
   stations; 'fit' reframes without touching the angle you are already at. */
function frameView(kind){
  var box=new THREE.Box3().setFromObject(contentGroup);
  if(box.isEmpty()) return;
  var size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  var radius=Math.max(size.length()/2, 0.5);
  var d=radius/Math.sin(camera.fov*Math.PI/360)*1.15;
  var dir;
  if(kind==='top'){
    dir=new THREE.Vector3(0,1,0);
    // Rhino +Y maps to three -Z, so that is what "north" means on a plan
    camera.up.set(0,0,-1);
  } else {
    camera.up.set(0,1,0);
    dir = (kind==='axo')
      ? new THREE.Vector3(1,1,1).normalize()
      : camera.position.clone().sub(controls.target).normalize();
    if(!isFinite(dir.x) || dir.lengthSq()===0) dir=new THREE.Vector3(1,1,1).normalize();
  }
  camera.position.copy(center).add(dir.multiplyScalar(d));
  controls.target.copy(center);
  controls.update();
}
function fitCameraToObject(){ frameView('axo'); }

/* ═══════════════════════════════════════════════════════════════
   PART 2 — quantities.
   The plugin already sends everything we need, and its rule is the simple
   one: Point→count, Curve→length, Surface→area, and a Brep/Mesh that is a
   closed solid additionally gets volume. So volume>0 IS the "this is a solid"
   test — no face-normal analysis needed.

     solid   -> volume  (its real thickness is modelled, so we use it)
     surface -> area    (thickness is not modelled, so it stays an assumption)

   Carbon Conscience's concrete factors are purely volumetric — 1116.8 kg/m³
   across 100/150/200 mm, and its "1M retaining wall + 1M footer" is exactly
   1116.8 × 2.0 m³ — so volume maps onto them directly.
   ═══════════════════════════════════════════════════════════════ */
var CONCRETE_KG_M3 = 1116.8;   // verified against 033001.01/.02/.03
var WALL_M3_PER_UNIT = 2.0;    // 033001.04 = 1 m³ wall + 1 m³ spread footing

/* ═══════════════════════════════════════════════════════════════
   PART 3 — resolver.  Same rules as the prototype, against the full
   Carbon Conscience V2 set (192 assemblies / 214 elements).
   ═══════════════════════════════════════════════════════════════ */
var WALL_1M='033001.04', WALL_1M_RB='033001.22', WALL_2M='033001.05', WALL_2M_RB='033001.23';
var PAVING={'033001.01':1,'033001.21':1,'321100.01':1,'321440.01':1,'321416.02':1,
            '321216.01':1,'321313.01':1,'323913.01':1,'321540.01':1,'321100.02':1};
var TREEPLANT={'329300.07':1,'329300.08':1};
var CANOPY={'329300.28':144,'329300.29':36,'329300.30':16};
var TREE_CURVE=[[144,-383.2],[36,-202.8],[16,-136.2]];
function perTree(m2){
  var P=TREE_CURVE;
  if(m2>=P[0][0]) return {v:P[0][1],clamp:true};
  if(m2<=P[2][0]) return {v:P[2][1],clamp:true};
  for(var i=0;i<P.length-1;i++){
    var x1=P[i][0],y1=P[i][1],x2=P[i+1][0],y2=P[i+1][1];
    if(m2<=x1&&m2>=x2) return {v:y1+(m2-x1)/(x2-x1)*(y2-y1),clamp:false};
  }
  return {v:P[2][1],clamp:true};
}

function resolve(cg){
  var ref=ASSIGN[cg.color];
  if(!ref) return {ref:null,items:[],notes:[]};

  if(ref.indexOf('mat:')===0){                 // solid priced by its own volume
    var key=ref.slice(4), m=MAT[key];
    if(!m) return {ref:null,items:[],notes:[]};
    var V0=cg.qty.volume;
    return {ref:ref, lu:null, material:key, items:[{
      id:'mat:'+key, e:{d:key, csi:'by volume',
      lo:m.lo, me:m.me, hi:m.hi, sq:0, st:0}, pct:1, qty:V0, prov:'m', u:'V'}],
      treeSeq:0, treeInfo:null,
      notes:[]};
  }

  var lu=CC.landuses[ref];
  if(!lu) return {ref:null,items:[],notes:[]};

  var A=cg.qty.surfArea;                  // ground area only — never a solid's skin
  var V=cg.qty.volume;                     // solids: real modelled volume
  var wallUnits=V>0?V/WALL_M3_PER_UNIT:0;  // 033001.04 == 2.0 m3
  var items=[], notes=[];

  lu.sub.forEach(function(p){
    var pct=p[0], id=p[1], e=CC.elements[id];
    if(!e) return;
    var qty, prov;
    if(id===WALL_1M||id===WALL_1M_RB){ qty=wallUnits; prov=V>0?'m':'a'; }
    else if(TREEPLANT[id]&&cg.qty.count>0){ qty=cg.qty.count*10; prov='m'; }
    else if(CANOPY[id]&&cg.qty.count>0){ qty=0; prov='m'; }
    else { qty=A*pct; prov='a'; }   // area x published percentage
    items.push({id:id,e:e,pct:pct,qty:qty,prov:prov});
  });



  var treeSeq=0, treeInfo=null;
  if(cg.qty.count>0 && lu.sub.some(function(p){return CANOPY[p[1]];})){
    var m2=A/cg.qty.count, pt=perTree(m2);
    treeSeq=pt.v*cg.qty.count;
    treeInfo={m2:m2,spacing:Math.sqrt(m2),per:pt.v,n:cg.qty.count,clamp:pt.clamp};

  }
  return {ref:ref,lu:lu,items:items,treeSeq:treeSeq,treeInfo:treeInfo,notes:notes};
}
function carbon(r){
  var o={lo:0,me:0,hi:0,sq:0,st:0};
  r.items.forEach(function(it){
    var L=it.e.lo,M=it.e.me,H=it.e.hi;
    if(it.mix){var t=it.mix.t,m=it.mix.el; L+=(m.lo-L)*t; M+=(m.me-M)*t; H+=(m.hi-H)*t;}
    o.lo+=L*it.qty; o.me+=M*it.qty; o.hi+=H*it.qty;
    o.sq+=it.e.sq*it.qty; o.st+=it.e.st*it.qty;
  });
  o.sq+=r.treeSeq||0;
  return o;
}
function curve(total,maturity){
  var r=8/maturity,t0=maturity/2,f=function(t){return 1/(1+Math.exp(-r*(t-t0)));};
  var f0=f(0),f60=f(60),out=[];
  for(var t=0;t<=60;t++) out.push(total*((f(t)-f0)/(f60-f0)));
  return out;
}

/* ═══════════════════════════════════════════════════════════════
   PART 4 — state + UI
   ═══════════════════════════════════════════════════════════════ */
/* ── display units ────────────────────────────────────────────────
   Everything is computed in metres — the geometry arrives in metres and the
   Carbon Conscience factors are per m²/m³. These multipliers are presentation
   only; nothing below them ever feeds a calculation.                        */
/* MAT arrives from /data/materials.js */
var UNITS={
  m : {name:'Meters (m)',      len:1,            area:1,           vol:1,            L:'m',  A:'m²',  V:'m³',  dp:[0,1]},
  cm: {name:'Centimeters (cm)',len:100,          area:1e4,         vol:1e6,          L:'cm', A:'cm²', V:'cm³', dp:[0,0]},
  mm: {name:'Millimeters (mm)',len:1000,         area:1e6,         vol:1e9,          L:'mm', A:'mm²', V:'mm³', dp:[0,0]},
  ft: {name:'Feet (ft)',       len:3.280839895,  area:10.76391042, vol:35.31466672,  L:'ft', A:'ft²', V:'ft³', dp:[0,1]},
  in: {name:'Inches (in)',     len:39.37007874,  area:1550.0031,   vol:61023.74409,  L:'in', A:'in²', V:'in³', dp:[0,0]},
  yd: {name:'Yards (yd)',      len:1.093613298,  area:1.195990046, vol:1.307950619,  L:'yd', A:'yd²', V:'yd³', dp:[0,1]}
};
var DISP='m';

/* What a colour group IS decides what you can pick for it and how it is priced.
   A landuse assembly ("Pedestrian Concrete Hardscape") is defined per m2 of
   ground and bundles paving + base + drainage + lighting. Applying that to a
   pile of solids is meaningless, so solids get a per-m3 material instead. */
function groupKind(cg){
  if(cg.qty.solids>0 && cg.qty.surfaces===0) return 'solid';
  if(cg.qty.surfaces>0 && cg.qty.solids===0) return 'surface';
  return cg.qty.solids>0?'mixed':'surface';
}
var MATLIST=Object.keys(MAT).sort(function(a,b){return MAT[a].me-MAT[b].me;}).map(function(k){
  return {v:'mat:'+k, label:k, meta:Math.round(MAT[k].me)+' kg/m³', group:'By volume'};
});

/* RATE[] is always stored as $ per m2 so the maths never depends on what the
   user is looking at. The input box shows and accepts $ per display unit. */
function rateToDisplay(r,solid){ if(r==null||r==='') return '';
  var v=Number(r)/(solid?U().vol:U().area); return String(+v.toPrecision(6)); }
function rateToCanonical(v,solid){ if(v==null||v==='') return '';
  return Number(v)*(solid?U().vol:U().area); }
function perLabel(kgPerM2){
  var u=U(), v=kgPerM2/u.area;
  var dp = v>=100?0 : v>=10?1 : v>=1?2 : 4;
  return num(v,dp)+' kg/'+u.A;
}

function U(){ return UNITS[DISP]||UNITS.m; }
function num(v,dp){ return v.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function fmtA(m2){ var u=U(); return num(m2*u.area,u.dp[0])+' '+u.A; }        // area
function fmtV(m3){ var u=U(); return num(m3*u.vol ,u.dp[1])+' '+u.V; }        // volume
function fmtL(m ){ var u=U(); return num(m *u.len ,u.dp[0])+' '+u.L; }        // length
function areaVal(m2){ var u=U(); return num(m2*u.area,u.dp[0]); }
function volVal(m3){ var u=U(); return num(m3*u.vol ,u.dp[1]); }

var MODEL={meta:null,groups:[]}, ASSIGN={}, RATE={}, VIS={};
var UI={tab:'mat',open:{},theme:'light',picker:null,dd:null,mode:'colour',
        grid:true,pal:'magma',pop:null};
var PROJECT='Untitled project';
var $=function(s){return document.querySelector(s);};
function t1(v){return (v/1000).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(v){ return '$ '+Math.round(v||0).toLocaleString('en-US'); }
function costLabel(r,a){ return money((r==null||r==='')?0:Number(r)*a); }
var PVN={m:'Measured',a:'Reference',o:'Overridden'};
var DATASET='Carbon Conscience V2 (Sasaki, 2023)';
var ORIGIN={
  m:'Quantity taken off your Rhino geometry. Revise the model to change it.',
  a:'Quantity from the published assembly in '+DATASET+', scaled to your measured area. '+
    'Your model does not yet define this element.',
  o:'Value you entered, replacing the published figure. Flagged as such in every export.'
};


/* Ecosystem assemblies. Sixteen ecosystem types each appear three times in the
   dataset — once to retain, once to clear, once to restore — which is where
   48 of the 193 assemblies come from. Which of them are plausible is a property
   of where the project is, not a design decision, so the climate zone decides
   it once instead of the user picking from all sixteen every time. */
var ECOSYSTEMS=['Tropical Rainforest','Tropical Moist Deciduous','Tropical Dry Deciduous',
  'Tropical Shrublands','Mangrove','Peat Swamp','Subtropical Humid Forest',
  'Dry Forest (Mediterranean)','Temperate Oceanic Rainforest','Temperate Continental Forest',
  'Boreal Forest','Prairie Grassland','Dry Meadows','Temperate Mixed Shrub and Forb Landscape',
  'Temperate Wetland and Salt Marsh','Turf'];

var CLIMATE_ECO={
  tropical:      ['Tropical Rainforest','Tropical Moist Deciduous','Tropical Dry Deciduous',
                  'Tropical Shrublands','Mangrove','Peat Swamp','Turf'],
  subtropical:   ['Subtropical Humid Forest','Mangrove','Peat Swamp','Tropical Moist Deciduous',
                  'Tropical Dry Deciduous','Turf'],
  mediterranean: ['Dry Forest (Mediterranean)','Dry Meadows','Prairie Grassland',
                  'Temperate Mixed Shrub and Forb Landscape','Turf'],
  oceanic:       ['Temperate Oceanic Rainforest','Temperate Continental Forest',
                  'Temperate Mixed Shrub and Forb Landscape','Temperate Wetland and Salt Marsh',
                  'Prairie Grassland','Dry Meadows','Turf'],
  continental:   ['Temperate Continental Forest','Boreal Forest','Prairie Grassland','Dry Meadows',
                  'Temperate Mixed Shrub and Forb Landscape','Temperate Wetland and Salt Marsh','Turf'],
  boreal:        ['Boreal Forest','Temperate Wetland and Salt Marsh','Turf']

var CLIMATE='continental';

/* the ecosystem an assembly describes, or null if it is not an ecosystem */
function ecoOf(name){
  var best=null;
  ECOSYSTEMS.forEach(function(e){
    if(name.indexOf(e)>=0 && (!best||e.length>best.length)) best=e;
  });
  return best;
}
/* assigned assemblies whose ecosystem does not belong in the chosen zone —
   changing the zone does not silently rewrite a choice the user already made,
   so the mismatch has to be surfaced instead */
function offClimate(){
  var out=[];
  MODEL.groups.forEach(function(cg){
    var ref=ASSIGN[cg.color];
    if(!ref||ref.indexOf('mat:')===0) return;
    var lu=CC.landuses[ref];
    if(lu && ecoOf(lu.n) && !ecoFits(lu.n)) out.push(cg.color);
  });
  return out;
}
function ecoFits(name){
  var e=ecoOf(name);
  if(!e) return true;                       // not an ecosystem: always relevant
  return (CLIMATE_ECO[CLIMATE]||[]).indexOf(e)>=0;
}

var FAMLIST=(function(){
  var tiers={}, out=[];
  Object.keys(CC.landuses).forEach(function(ref){
    var t=CC.landuses[ref].t[0];
    (tiers[t]=tiers[t]||[]).push(ref);
  });
  ['Hardscape','Softscape','Existing to Remain','Demolition and Preparation']
    .filter(function(t){return tiers[t];})
    .forEach(function(t){
      tiers[t].forEach(function(ref){
        var nm=CC.landuses[ref].n;
        out.push({v:ref, label:nm, meta:'', group:t, eco:ecoOf(nm)});
      });
    });
  return out;
})();

function siteTotals(){
  var o={lo:0,me:0,hi:0,sq:0,st:0,area:0,cost:0,anyCost:false};
  MODEL.groups.forEach(function(cg){
    var c=carbon(resolve(cg));
    o.lo+=c.lo;o.me+=c.me;o.hi+=c.hi;o.sq+=c.sq;o.st+=c.st;
    o.area+=cg.qty.surfArea;      // ground area only; a solid's skin is not a plot
    var r=RATE[cg.color];
    if(r!=null&&r!==''){
      o.cost+=Number(r)*(groupKind(cg)==='solid'?cg.qty.volume:cg.qty.surfArea);
      o.anyCost=true;
    }
  });
  return o;
}


/* Material picker. A native <select> truncates long names and cannot be
   searched, and 192 assemblies is far too many to scroll. This renders the
   list inline and filters it in place — filtering never calls paint(), so
   the open list and the caret survive the background sync. */
function pickerLabel(kind, ref){
  if(!ref) return null;
  if(ref.indexOf('mat:')===0){
    var k=ref.slice(4);
    return MAT[k] ? k+'  ('+Math.round(MAT[k].me)+' kg/m\u00b3)' : k;
  }
  return (CC.landuses[ref]||{}).n || ref;
}
function picker(cg, kind, ref){
  var open=(UI.picker===cg.color);
  var label=pickerLabel(kind, ref);
  var h='<button class="pick'+(ref?'':' none')+'" data-pick="'+cg.color+'">'+
        '<span>'+(label?esc(label):'Select a material')+'</span>'+
        '<span class="chev">'+(open?'\u25b4':'\u25be')+'</span></button>';
  if(!open) return h;

  var list=(kind==='solid')?MATLIST:FAMLIST.slice().sort(function(a,b){
    var af=ecoFits(a.label)?0:1, bf=ecoFits(b.label)?0:1;
    return af-bf;                            // climate-appropriate first
  }).map(function(o){
    return ecoFits(o.label) ? o
      : {v:o.v, label:o.label, meta:o.meta, group:'Other climates', eco:o.eco};
  });
  h+='<div class="pickbox">'+
     '<input class="picksearch" type="text" data-search="'+cg.color+'" placeholder="Search '+
     list.length+' options" autocomplete="off">'+
     '<div class="picklist" data-list="'+cg.color+'">';
  var lastGroup=null;
  list.forEach(function(o){
    if(o.group!==lastGroup){
      lastGroup=o.group;
      h+='<div class="pickgroup" data-g="'+esc(o.group)+'">'+esc(o.group)+'</div>';
    }
    h+='<button class="pickopt'+(o.v===ref?' sel':'')+'" data-opt="'+esc(o.v)+
       '" data-col="'+cg.color+'" data-t="'+esc((o.label+' '+o.meta).toLowerCase())+'">'+
       '<span class="lbl">'+esc(o.label)+'</span>'+
       (o.meta?'<span class="mt">'+esc(o.meta)+'</span>':'')+'</button>';
  });
  return h+'</div></div>';
}

function breakdown(cg,r){

/* Three readings of the same geometry: as Rhino coloured it, by carbon, by
   cost. Carbon and cost shade by each group's share of the site total, so the
   map answers "where is it concentrated" rather than "what is dense". */
var MATS={};
var PALETTES=[
  /* Stops run low -> high, so the pale end is the small number and the dark end
     the large one. Storing them this way means the ramp, the swatches and the
     exported image all read the same direction without any of them reversing. */
  {id:'magma',  name:'Magma',   c:['#fbdf8f','#f0813a','#c33d55','#6a2b6e','#241a38']},
  {id:'viridis',name:'Viridis', c:['#fde725','#5ec962','#21918c','#3b528b','#440154']},
  {id:'inferno',name:'Inferno', c:['#fcffa4','#f98e09','#bc3754','#57106e','#0b0417']},
  {id:'plasma', name:'Plasma',  c:['#f0f921','#fca636','#e16462','#b12a90','#3b049a']},
  {id:'cividis',name:'Cividis', c:['#fdea45','#a09073','#666970','#31446b','#00204d']},
  {id:'ember',  name:'Ember',   c:['#ffd980','#f0883b','#c1440e','#5c1a3a','#14121f']},
  {id:'teal',   name:'Teal',    c:['#d7f2ec','#67c9bc','#1f8a80','#0f4b47','#08201f']},
  {id:'ocean',  name:'Ocean',   c:['#eaf4fb','#9ecae1','#3182bd','#1c4f8c','#0a2540']},
  {id:'forest', name:'Forest',  c:['#f7fcb9','#c2e699','#78c679','#31a354','#00441b']},
  {id:'slate',  name:'Slate',   c:['#e6ecf1','#b3c0cc','#77899b','#40536a','#101820']}
];
function palette(){
  var p=PALETTES.filter(function(x){return x.id===UI.pal;})[0];
  return (p||PALETTES[0]).c;
}
function heatAt(t){
  t=Math.max(0,Math.min(1,t));
  var HEAT=palette();
  var n=HEAT.length-1, i=Math.min(n-1,Math.floor(t*n)), f=t*n-i;
  function ch(h,k){return parseInt(h.slice(1+k*2,3+k*2),16);}
  var a=HEAT[i], b=HEAT[i+1], out='#';
  for(var k=0;k<3;k++){
    var v=Math.round(ch(a,k)+(ch(b,k)-ch(a,k))*f).toString(16);
    out += v.length<2?'0'+v:v;
  }
  return out;
}
function groupValue(cg, mode){
  if(mode==='carbon') return Math.abs(carbon(resolve(cg)).me);
  if(mode==='cost'){
    var r=RATE[cg.color];
    if(r==null||r==='') return 0;
    return Math.abs(Number(r)*(groupKind(cg)==='solid'?cg.qty.volume:cg.qty.surfArea));
  }
  return 0;
}
function applyMode(){
  var mode=UI.mode, vals={}, live=[];
  MODEL.groups.forEach(function(cg){
    var v=groupValue(cg,mode);
    vals[cg.color]=v;
    if(v>0) live.push(v);            // a group with no material is absent, not zero
  });
  var any=live.length>0;
  var lo=any?Math.floor(Math.min.apply(null,live)):0;
  var hi=any?Math.ceil (Math.max.apply(null,live)):0;
  if(hi<=lo) hi=lo+1;                // a single group, or every group equal
  MODEL.groups.forEach(function(cg){
    var m=MATS[cg.color];
    if(!m) return;
    if(mode==='colour'||!any||vals[cg.color]<=0) m.color.set(cg.color);
    else m.color.set(heatAt((vals[cg.color]-lo)/(hi-lo)));
  });
  drawModeBar(vals,lo,hi,any);
}
function drawModeBar(vals,lo,hi,any){
  var modes=[{id:'colour',name:'Colour'},{id:'carbon',name:'Carbon'},{id:'cost',name:'Cost'}];
  $('#modeSeg').innerHTML=modes.map(function(m){
    return '<button data-mode="'+m.id+'" aria-pressed="'+(UI.mode===m.id)+'">'+m.name+'</button>';
  }).join('');
  $('#modeSeg').querySelectorAll('[data-mode]').forEach(function(b){
    b.onclick=function(){ UI.mode=b.dataset.mode; paint(true); };
  });
  var ramp=$('#ramp');
  if(UI.mode==='colour'){ ramp.hidden=true; return; }
  ramp.hidden=false;
  if(!any){
    ramp.innerHTML='<div class="dm-note">'+(UI.mode==='cost'
      ? 'No rates entered \u2014 add one under a colour group'
      : 'Nothing assigned yet')+'</div>';
    return;
  }
  var cost=(UI.mode==='cost');
  var fmt=function(v,round){
    var n=cost?(v||0):(v||0)/1000;
    n=round(n);
    return (cost?'$ ':'')+n.toLocaleString('en-US')+(cost?'':' t');
  };
  // only the two ends are labelled — the ramp is read by position, not by
  // matching a group against a list of numbers
  var ticks=MODEL.groups.map(function(cg){ return vals[cg.color]; })
    .filter(function(v){ return v>0; })
    .sort(function(a,b){ return a-b; });
  var hiTxt=fmt(ticks[ticks.length-1],Math.ceil),
      loTxt=(ticks.length>1)?fmt(ticks[0],Math.floor):'';
  lastScale={hi:hiTxt, lo:loTxt};
  var html='<span class="dm-lab dm-hi">'+esc(hiTxt)+'</span>';
  if(loTxt) html+='<span class="dm-lab dm-lo">'+esc(loTxt)+'</span>';
  ramp.innerHTML='<div class="dm-grad" style="background:linear-gradient(to top,'+palette().join(',')+')"></div>'+
    '<div class="dm-scale">'+html+'</div>';
}


/* Right-hand toolbar. Everything here changes how the model is *looked at*,
   never what it is worth - the numbers are the panel's job. */

/* A scheme is every choice that moves the totals: what each colour is made of,
   what it costs, and the climate the assemblies are read against. The geometry
   is deliberately not part of it - the point is to hold the model still and
   vary the specification. */
var SKEY='carbontools.schemes.v1';
var SCHEMES=[];
(function(){ try{ SCHEMES=JSON.parse(localStorage.getItem(SKEY))||[]; }catch(e){ SCHEMES=[]; } })();
function persistSchemes(){
  try{ localStorage.setItem(SKEY, JSON.stringify(SCHEMES)); }
  catch(e){ /* private mode or quota - the session still works in memory */ }
}
function captureScheme(name){
  var st=siteTotals();
  return {id:String(Date.now()), name:name, ts:new Date().toISOString(),
          assign:JSON.parse(JSON.stringify(ASSIGN)), rate:JSON.parse(JSON.stringify(RATE)),
          climate:CLIMATE, carbon:st.me, cost:st.cost, anyCost:st.anyCost};
}
function applyScheme(sc){
  ASSIGN=JSON.parse(JSON.stringify(sc.assign||{}));
  RATE  =JSON.parse(JSON.stringify(sc.rate||{}));
  if(sc.climate) CLIMATE=sc.climate;
  UI.pop=null;
  paint(true);
}
function schemeSig(assign, rate, climate){
  var norm=function(o){
    return Object.keys(o||{})
      .filter(function(k){ return o[k]!=null && o[k]!==''; })
      .sort()
      .map(function(k){ return k+'='+o[k]; }).join('|');
  };
  return norm(assign)+'//'+norm(rate)+'//'+climate;
}
function schemePop(){
  var st=siteTotals(), now=st.me;
  var live=schemeSig(ASSIGN, RATE, CLIMATE);
  var onOne=SCHEMES.some(function(sc){ return schemeSig(sc.assign,sc.rate,sc.climate)===live; });
  var h='<div class="tb-ttl">SCHEMES</div>';
  h+='<div class="tb-row'+(onOne?'':' now')+'"><span class="nm">Current'+
     (onOne?'':' \u00b7 unsaved')+'</span>'+
     '<span class="fig">'+esc(t1(now))+' t</span>'+
     '<span class="fig">'+esc(st.anyCost?money(st.cost):'\u2014')+'</span>'+
     '<span class="dlt"></span></div>';
  SCHEMES.forEach(function(sc){
    var active=(schemeSig(sc.assign,sc.rate,sc.climate)===live);
    var d = now!==0 ? ((sc.carbon-now)/Math.abs(now))*100 : 0;
    var cls = Math.abs(d)<0.5 ? '' : (d>0?'up':'dn');
    var txt = Math.abs(d)<0.5 ? '\u2014' : (d>0?'+':'\u2212')+Math.abs(d).toFixed(0)+'%';
    h+='<div class="tb-row'+(active?' now':'')+'">'+
       '<button class="nm" data-load="'+sc.id+'" title="Load this scheme">'+
       esc(sc.name)+'</button>'+
       '<span class="fig">'+esc(t1(sc.carbon))+' t</span>'+
       '<span class="fig">'+esc(sc.anyCost?money(sc.cost):'\u2014')+'</span>'+
       '<span class="dlt '+cls+'">'+txt+'</span>'+
       '<button class="del" data-del="'+sc.id+'" title="Delete">\u00d7</button></div>';
  });
  if(!SCHEMES.length)
    h+='<div class="tb-msg">Nothing saved yet. Set the materials you want, name the '+
       'combination, then change one and compare.</div>';
  h+='<div class="tb-new"><input id="schName" type="text" placeholder="Name this scheme" '+
     'maxlength="40"><button id="schSave">Save</button></div>';
  return h;
}
function wireSchemePop(pop){
  pop.querySelectorAll('[data-load]').forEach(function(b){
    b.onclick=function(){
      var sc=SCHEMES.filter(function(x){return x.id===b.dataset.load;})[0];
      if(sc) applyScheme(sc);
    };
  });
  pop.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      SCHEMES=SCHEMES.filter(function(x){return x.id!==b.dataset.del;});
      persistSchemes();
      drawToolbar();
    };
  });
  var inp=pop.querySelector('#schName'), btn=pop.querySelector('#schSave');
  function save(){
    var n=(inp.value||'').trim();
    if(!n){ inp.focus(); return; }
    SCHEMES.push(captureScheme(n));
    persistSchemes();
    inp.value='';
    drawToolbar();
  }
  btn.onclick=save;
  inp.onkeydown=function(e){ if(e.key==='Enter') save(); };
  inp.onclick=function(e){ e.stopPropagation(); };
}

function drawToolbar(){
  $('#tbFit').onclick=function(){ frameView('fit'); };
  $('#tbTop').onclick=function(){ frameView('top'); };
  $('#tbAxo').onclick=function(){ frameView('axo'); };

  var gb=$('#tbGrid');
  gb.setAttribute('aria-pressed', String(UI.grid));
  gb.onclick=function(){ UI.grid=!UI.grid; grid.visible=UI.grid; drawToolbar(); };

  $('#tbShot').onclick=saveImage;

  var pop=$('#tbPop');
  [['#tbSch','sch'],['#tbPal','pal']].forEach(function(pair){
    var b=$(pair[0]);
    b.setAttribute('aria-pressed', String(UI.pop===pair[1]));
    b.onclick=function(e){ e.stopPropagation(); UI.pop=(UI.pop===pair[1])?null:pair[1]; drawToolbar(); };
  });

  pop.hidden=!UI.pop;
  pop.classList.toggle('wide', UI.pop==='sch');
  if(UI.pop){
    var owner=$(UI.pop==='sch'?'#tbSch':'#tbPal');
    pop.style.top=owner.offsetTop+'px';      // open beside the button that owns it
    if(UI.pop==='pal'){
      pop.innerHTML='<div class="tb-ttl">LEGEND COLOURS</div>'+PALETTES.map(function(p){
        return '<button class="tb-opt" data-pal="'+p.id+'" aria-pressed="'+(UI.pal===p.id)+'">'+
          '<span class="tb-sw" style="background:linear-gradient(90deg,'+p.c.join(',')+')"></span>'+
          esc(p.name)+'</button>';
      }).join('');
      pop.querySelectorAll('[data-pal]').forEach(function(b){
        b.onclick=function(){ UI.pal=b.dataset.pal; UI.pop=null; paint(true); };
      });
    } else {
      pop.innerHTML=schemePop();
      wireSchemePop(pop);
    }
  }
}
document.addEventListener('click',function(e){
  if(UI.pop && !e.target.closest('#toolbar')){ UI.pop=null; drawToolbar(); }
});

/* The viewport is saved with its legend drawn in, so the file still means
   something once it is out of the app and in a report. The DOM panel is not
   part of the image - a WebGL canvas is all the browser can hand over without
   an external rasteriser. */
function saveImage(){
  renderer.render(scene,camera);
  var src=renderer.domElement;
  var c=document.createElement('canvas');
  c.width=src.width; c.height=src.height;
  var g=c.getContext('2d');
  g.fillStyle=(UI.theme==='dark')?'#1e2732':'#ffffff';
  g.fillRect(0,0,c.width,c.height);
  g.drawImage(src,0,0);

  if(UI.mode!=='colour'){
    var k=c.width/window.innerWidth;          // device pixel ratio
    var x=46*k, bot=c.height-70*k, h=210*k, w=9*k;
    var grad=g.createLinearGradient(0,bot,0,bot-h);
    var cols=palette();
    cols.forEach(function(col,i){ grad.addColorStop(i/(cols.length-1),col); });
    var r=w/2;
    g.fillStyle=grad;
    g.beginPath();
    if(g.roundRect) g.roundRect(x,bot-h,w,h,r); else g.rect(x,bot-h,w,h);
    g.fill();

    var lab=lastScale;
    g.fillStyle=(UI.theme==='dark')?'#9dadba':'#54636f';
    g.font=(10.5*k)+'px ui-monospace, Menlo, Consolas, monospace';
    g.textAlign='left';
    if(lab){
      g.textBaseline='top';    g.fillText(lab.hi, x+w+7*k, bot-h);
      g.textBaseline='bottom'; g.fillText(lab.lo, x+w+7*k, bot);
    }
  }

  var a=document.createElement('a');
  a.download='carbon-'+UI.mode+'-'+new Date().toISOString().slice(0,10)+'.png';
  a.href=c.toDataURL('image/png');
  a.click();
}
var lastScale=null;

function drawTabs(){
  $('#tabs').innerHTML=VIEWS.map(function(v){
    return '<button data-view="'+v.id+'" aria-pressed="'+(UI.tab===v.id)+'">'+v.name+'</button>';
  }).join('');
  $('#tabs').querySelectorAll('[data-view]').forEach(function(b){
    b.onclick=function(){ UI.tab=b.dataset.view; paint(true); };
  });
}

function paint(force){
  // A background poll must never tear out an open dropdown or a half-typed rate.
  // A change the user just committed must redraw at once — hence force.
  if(!force && panelBusy()){ paintPending=true; return; }
  paintPending=false;
  document.documentElement.dataset.t=UI.theme;
  syncTheme();                       // keep the sun/moon highlight on the active theme
  var dark=(UI.theme==='dark');
  scene.background=new THREE.Color(dark?0x1e2732:0xffffff);
  scene.remove(grid);
  grid = new THREE.GridHelper(200, 40, dark?0x4a5a6e:0xccd5dd, dark?0x384555:0xe3e9ee);
  grid.visible = UI.grid;
  scene.add(grid);
  drawTabs();
  drawSelects();
  drawToolbar();
  applyMode();
  $('#panelBody').innerHTML = UI.tab==='mat' ? matTab() : UI.tab==='res' ? resTab() : repTab();
  if(UI.tab==='mat') wire();


  var cw=$('#climateWarn');
  if(cw){
    var off=offClimate();
    cw.hidden=!off.length;
    if(off.length) cw.innerHTML='<b>'+off.length+'</b> assigned assembl'+
      (off.length===1?'y is':'ies are')+' outside this zone: '+off.join(', ');
  }

  var st=siteTotals();

  var mt=MODEL.meta, warn=$('#unitWarn');
  if(warn){
    // only speaks up when the document has no unit system, which makes every
    // number wrong by an unknown factor
    var bad = mt && mt.units_trusted===false;
    warn.hidden = !bad;
    if(bad) warn.textContent='Rhino document has no unit system. Values are unscaled \u2014 set the model units in Rhino.';
  }
}

function wire(){
  document.querySelectorAll('[data-pick]').forEach(function(b){
    b.onclick=function(){
      UI.picker=(UI.picker===b.dataset.pick)?null:b.dataset.pick;
      paint(true);
      var inp=document.querySelector('[data-search]');
      if(inp) inp.focus();
    };
  });
  document.querySelectorAll('[data-opt]').forEach(function(b){
    b.onclick=function(){
      ASSIGN[b.dataset.col]=b.dataset.opt;
      UI.picker=null;
      paint(true);
    };
  });
  document.querySelectorAll('[data-search]').forEach(function(inp){
    inp.onkeydown=function(e){ if(e.key==='Escape'){ UI.picker=null; paint(true); } };
    inp.oninput=function(){                      // filter in place — never repaints
      var q=inp.value.trim().toLowerCase();
      var box=document.querySelector('[data-list="'+inp.dataset.search+'"]');
      if(!box) return;
      var seen={};
      box.querySelectorAll('[data-opt]').forEach(function(o){
        var hit=!q||o.dataset.t.indexOf(q)>=0;
        o.style.display=hit?'':'none';
        if(hit){
          var g=o.previousElementSibling;
          while(g&&!g.classList.contains('pickgroup')) g=g.previousElementSibling;
          if(g) seen[g.dataset.g]=true;
        }
      });
      box.querySelectorAll('.pickgroup').forEach(function(g){
        g.style.display=seen[g.dataset.g]?'':'none';
      });
    };
  });
  document.querySelectorAll('[data-exp]').forEach(function(b){
    b.onclick=function(){ UI.open[b.dataset.exp]=!UI.open[b.dataset.exp]; paint(); };
  });
  document.querySelectorAll('[data-k]').forEach(function(b){
    b.onclick=function(){ UI.open[b.dataset.k]=!UI.open[b.dataset.k]; paint(); };
  });
  document.querySelectorAll('[data-vis]').forEach(function(b){
    b.onclick=function(){ var c=b.dataset.vis; VIS[c]=(VIS[c]===false); applyVis(); paint(); };
  });
  document.querySelectorAll('[data-iso]').forEach(function(b){
    b.onclick=function(){ var c=b.dataset.iso;
      MODEL.groups.forEach(function(g){ VIS[g.color]=(g.color===c); });
      applyVis(); paint(); };
  });
  document.querySelectorAll('[data-cost]').forEach(function(inp){
    inp.oninput=function(e){                       // in-place: a redraw would steal focus
      var c=inp.dataset.cost, val=e.target.value;
      var g=MODEL.groups.filter(function(x){return x.color===c;})[0];
      var solid=g?groupKind(g)==='solid':false;
      RATE[c]=rateToCanonical(val,solid);    // canonical: $/m2 for area, $/m3 for volume
      var A=g?(solid?g.qty.volume:g.qty.surfArea):0;
      var cell=document.getElementById('ct-'+c.slice(1));
      if(cell){ cell.textContent=costLabel(RATE[c],A); }
      var st=siteTotals(), gc=$('#grandCost');
      if(gc) gc.textContent=money(st.cost);
    };
  });
}
function applyVis(){
  contentGroup.children.forEach(function(ch){
    ch.visible = VIS[ch.userData.groupColor]!==false;
  });
}

/* ── ingest one sync payload ── */
var firstLoad=true;
function ingest(data){
  contentGroup.clear();
  MODEL.meta=data.meta;
  MODEL.groups=(data.groups||[]).map(function(group){
    var color=new THREE.Color(group.color);
    var material=new THREE.MeshStandardMaterial({color:color,side:THREE.DoubleSide});
    MATS[group.color]=material;
    /* solids and surfaces are tallied separately — the plugin already tells
       them apart by whether it could compute a volume */
    var q={area:0,surfArea:0,volume:0,count:0,length:0,solids:0,surfaces:0};
    group.objects.forEach(function(obj){
      q.count++;
      var Q=obj.quantity||{};
      var vol=Q.volume||0;
      q.area+=Q.area||0; q.length+=Q.length||0;
      if(vol>0){ q.volume+=vol; q.solids++; }
      else { q.surfArea+=Q.area||0; q.surfaces++; }
      if(obj.mesh&&obj.mesh.vertices&&obj.mesh.vertices.length){
        var mesh=new THREE.Mesh(buildGeometry(obj.mesh),material);
        mesh.userData.groupColor=group.color;
        contentGroup.add(mesh);
      }
    });
    return {color:group.color,qty:q};
  });
  applyVis();
  $('#syncErr').hidden=true;
  if(firstLoad && contentGroup.children.length>0){ fitCameraToObject(contentGroup); firstLoad=false; }
  paint();
}

var lastRaw=null;
function poll(){
  fetch('/data.json',{cache:'no-store'})
    .then(function(r){return r.text();})
    .then(function(txt){
      if(txt===lastRaw){          // nothing changed in Rhino — leave the DOM alone
        $('#syncErr').hidden=true;
        return;
      }
      lastRaw=txt;
      ingest(JSON.parse(txt));
    })
    .catch(function(){
      var e=$('#syncErr');
      e.hidden=false;
      e.textContent='Rhino disconnected';
    })
    .then(function(){ setTimeout(poll,1500); });
}

document.addEventListener('focusout',function(){
  setTimeout(function(){ if(paintPending&&!panelBusy()) paint(); },0);
});
/* view switching lives on the tabs — see drawTabs() */

$('#projName').oninput=function(e){ PROJECT=e.target.value; };

function closeMenu(){
  $('#acctMenu').hidden=true;
  $('#avatar').setAttribute('aria-expanded','false');
}
$('#avatar').onclick=function(e){
  e.stopPropagation();
  var m=$('#acctMenu'), open=m.hidden;
  m.hidden=!open;
  $('#avatar').setAttribute('aria-expanded',String(open));

};
document.addEventListener('click',function(e){
  if(!$('#acctMenu').hidden && !e.target.closest('.acct')) closeMenu();
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeMenu(); });
function syncTheme(){
  document.querySelectorAll('[data-theme-set]').forEach(function(b){
    b.setAttribute('aria-pressed', String(UI.theme===b.dataset.themeSet));
    b.onclick=function(){ UI.theme=b.dataset.themeSet; paint(true); };
  });
}
syncTheme();
$('#signOut').onclick=function(){
  closeMenu();
  // no account layer yet — the backend in §17 of the decision record is not built
  alert('Accounts are not connected yet. This viewer runs entirely on your machine and stores nothing.');
};
paint();
poll();
