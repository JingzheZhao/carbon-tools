<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sitewise</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --card:#ffffff; --cardLine:#d6dde3; --track:#eef2f6; --field:#ffffff;
  --bar:rgba(252,253,254,.92); --shadow:0 2px 10px rgba(22,32,42,.08),0 1px 3px rgba(22,32,42,.05);
  --text:#1c2530; --sub:#5a6875; --dim:#8c98a5; --accentText:#0a6f6a; --line:#e2e9f0; --selBg:#dcf0ee; --ochreBg:#f6efe0; --redBg:#fdeef1; --redInk:#8e2a40;
  --scrollThumb:rgba(13,140,134,.62); --scrollThumbHover:rgba(13,140,134,.88);
  --accent:#0d8c86; --accentInk:#0a6f6a; --accentFill:#0a6f6a; --green:#2f7d5b; --ochre:#b8862b; --ochreInk:#8a6a2b; --red:#a4344e;
  --scene:#ffffff; --grid1:#ccd5dd; --grid2:#e3e9ee;
  --railW:52px;
  --r-shell:12px; --r-surface:9px; --r-ctrl:6px; --r-pill:999px;
  --fs-display:22px; --fs-figure:19px; --fs-card:14.5px; --fs-tab:13.5px; --fs-strong:13px;
  --fs-body:12px; --fs-meta:10.5px; --fs-label:9px;
  --cardLift:0 1px 2px rgba(22,32,42,.055);
  --cardLiftHover:0 3px 10px rgba(22,32,42,.10),0 1px 3px rgba(22,32,42,.06);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
[data-t="dark"]{
  --card:#161e25; --cardLine:#28323b; --track:#1c252d; --field:#111920;
  --bar:rgba(13,20,26,.92); --shadow:0 4px 16px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.35);
  --text:#e4e9ef; --sub:#9aa7b5; --dim:#6f7d8b; --accentText:#55e8d6; --line:#222e3a; --selBg:#123330; --ochreBg:#3a2f18; --redBg:#3a1c23; --redInk:#f0a7b3;
  --scrollThumb:rgba(51,204,189,.38); --scrollThumbHover:rgba(51,204,189,.62);
  --accent:#33ccbd; --accentInk:#6ff0e2; --accentFill:#10847b; --green:#4aa87c; --ochre:#e6b35c; --ochreInk:#f2ca80; --red:#d4707f;
  --scene:#1e2732; --grid1:#4a5a6e; --grid2:#384555;
  --cardLift:0 1px 2px rgba(0,0,0,.38);
  --cardLiftHover:0 3px 12px rgba(0,0,0,.52),0 1px 3px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--scene);color:var(--text);font-family:var(--sans);font-size:var(--fs-strong);line-height:1.5;-webkit-font-smoothing:antialiased}
.m{font-family:var(--mono)}
button,input,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--scrollThumb);border-radius:var(--r-surface)}
::-webkit-scrollbar-thumb:hover{background:var(--scrollThumbHover)}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--scrollThumb) transparent}   /* Firefox */

#viewport{position:fixed;inset:0}
#viewport canvas{display:block}

.bar{position:fixed;left:0;right:0;top:0;height:46px;z-index:40;display:flex;align-items:center;gap:16px;
  padding:0 14px;background:var(--bar);border-bottom:1px solid var(--cardLine);backdrop-filter:blur(6px)}
.wm{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.16em;color:var(--accentText)}
.wmv{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.1em;color:var(--dim)}
.spacer{flex:1}
.themeseg{display:flex;gap:2px;background:var(--track);border-radius:var(--r-ctrl);padding:2px}
.themeseg button{width:26px;height:24px;border:0;background:none;border-radius:var(--r-ctrl);cursor:pointer;
  color:var(--dim);display:flex;align-items:center;justify-content:center}
.themeseg button:hover{color:var(--sub)}
.themeseg button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}

/* Welcome screen. Shown until a project is open, and never skipped: silently
   restoring the last project would let you read one project's schemes against
   another's geometry with nothing on screen saying so. */
.wel{position:fixed;left:0;right:0;top:46px;bottom:0;z-index:38;background:var(--scene);
  display:flex;align-items:center;justify-content:center;padding:24px}
.wel[hidden]{display:none}
.welCard{width:100%;max-width:560px;background:var(--card);border:1px solid var(--cardLine);
  border-radius:var(--r-shell);box-shadow:var(--cardLiftHover);padding:34px 36px 30px}
.welHi{font-size:26px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
.welBtns{display:flex;gap:12px;margin-top:22px}
.welBtns button{flex:1;padding:11px 14px;border-radius:var(--r-surface);cursor:pointer;
  font-family:var(--sans);font-size:var(--fs-strong);font-weight:600}
.welNew{border:1px solid var(--accent);background:var(--accent);color:#fff}
.welOpen{border:1px solid var(--cardLine);background:var(--field);color:var(--text)}
.welBtns button:disabled{opacity:.45;cursor:not-allowed}
.welH{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.09em;color:var(--dim);
  margin:22px 0 2px}
/* three rows plus the heading, held whether the list is full, short or empty */
.welRecWrap{height:138px;overflow:hidden}
.welNone{font-size:var(--fs-body);color:var(--dim);padding:9px 4px}
.welRec{width:100%;display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;
  text-align:left;color:var(--text);font-family:var(--sans);font-size:var(--fs-body)}
.welRec:hover{background:var(--track)}
.welRec .welMeta{font-family:var(--mono);font-size:var(--fs-label);color:var(--dim);white-space:nowrap}
.welErr{margin-top:14px;padding:10px 12px;border-radius:var(--r-ctrl);
  border:1px dashed var(--ochre);background:var(--ochreBg);
  font-size:var(--fs-meta);color:var(--ochreInk);line-height:1.55}
.welErr[hidden]{display:none}

/* One group per kind of control: where you are looking, what the scene shows,
   what you take away. A gap between cards separates them better than a rule
   inside one card did. */
.tbStack{position:fixed;right:14px;top:58px;z-index:35;
  display:flex;flex-direction:column;gap:9px}
.tb-grp{display:flex;flex-direction:column;gap:3px;
  background:var(--card);border:1px solid var(--cardLine);border-radius:var(--r-ctrl);
  padding:3px;box-shadow:var(--cardLift)}
.tb-btn{width:30px;height:30px;border:0;background:none;border-radius:var(--r-ctrl);cursor:pointer;
  color:var(--dim);display:flex;align-items:center;justify-content:center}
.tb-btn:hover{background:var(--track);color:var(--sub)}
.tb-btn[aria-pressed="true"]{background:var(--selBg);color:var(--accentText)}
.tb-pop{position:absolute;right:calc(100% + 6px);width:180px;background:var(--card);
  border:1px solid var(--cardLine);border-radius:var(--r-surface);box-shadow:var(--cardLiftHover);
  padding:7px;display:flex;flex-direction:column;gap:2px}
.tb-pop[hidden]{display:none}   /* an author display rule outranks the attribute */
.tb-ttl{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.07em;color:var(--dim);
  padding:2px 4px 6px}
.tb-opt{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;
  padding:5px;border-radius:var(--r-ctrl);font-family:var(--sans);font-size:var(--fs-body);
  color:var(--sub);text-align:left}
.tb-opt:hover{background:var(--track)}
.tb-opt[aria-pressed="true"]{background:var(--selBg);color:var(--accentText);font-weight:600}
.tb-sw{width:46px;height:10px;border-radius:var(--r-pill);flex:none}
.tb-pop.wide{width:342px}
.dm-bar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:35;width:max-content}
.dm-seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--cardLine);
  border-radius:var(--r-ctrl);padding:3px;box-shadow:var(--shadow)}
.dm-seg button{border:0;background:none;padding:6px 15px;border-radius:var(--r-ctrl);cursor:pointer;
  font-family:var(--sans);font-size:var(--fs-body);font-weight:500;color:var(--dim)}
.dm-seg button:hover{color:var(--sub)}
.dm-seg button[aria-pressed="true"]{background:var(--selBg);color:var(--accentText);font-weight:600}
.dm-ramp{position:fixed;left:512px;bottom:22px;z-index:35;
  display:flex;flex-direction:row;align-items:stretch;gap:6px}
.dm-ramp[hidden]{display:none}   /* an author display rule outranks the attribute */
.dm-grad{width:9px;height:210px;border-radius:var(--r-pill);flex:none}
.dm-scale{position:relative;height:210px;font-family:var(--mono);
  font-size:var(--fs-label);color:var(--dim);white-space:nowrap}
.dm-scale span{position:absolute;left:0;padding-left:7px;line-height:1}
.dm-scale span.dm-hi{top:0}
.dm-scale span.dm-lo{bottom:0}
.dm-scale span.dm-lab{color:var(--sub);font-weight:500}
.dm-note{font-family:var(--mono);font-size:var(--fs-label);color:var(--dim);text-align:center;line-height:1.5}
.leftcol{position:fixed;left:12px;top:58px;bottom:16px;z-index:25;width:462px;
  display:flex;flex-direction:column;gap:10px}

.project{background:var(--card);border:1px solid var(--cardLine);border-radius:var(--r-shell);
  box-shadow:var(--shadow);padding:9px 12px 10px;flex:none;position:relative;z-index:30}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.period{font-family:var(--mono);font-size:var(--fs-label);color:var(--dim);white-space:nowrap}

/* The rail chooses a module; the tabs belong to the module it chose. One card
   holds both: they are two parts of a single surface, not two objects. */
.work{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--cardLine);border-radius:var(--r-shell);
  box-shadow:var(--shadow);overflow:hidden}
.workRow{flex:1;min-height:0;display:flex}
.rail{flex:none;width:var(--railW);display:flex;flex-direction:column;gap:6px;padding:12px 8px;
  background:var(--card);border-right:1px solid var(--line)}
.rail-btn{width:36px;height:36px;border:0;background:none;border-radius:var(--r-surface);
  cursor:pointer;color:var(--dim);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.02em}
.rail-btn:hover{background:var(--track);color:var(--sub)}
.rail-btn[aria-pressed="true"]{background:var(--accentFill);color:#fff}
.panel{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* One line marks the active tab. The strip shares the body's colour, so the
   card reads as a single sheet with a rule across it. */
.tabs{flex:none;display:flex;gap:0;background:var(--card);
  padding:0 25px 0 calc(var(--railW) + 15px);
  border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 0;position:relative;padding:14px 6px 12px;
  cursor:pointer;border:0;background:none;
  font-size:var(--fs-tab);font-weight:500;letter-spacing:-.005em;color:var(--dim);
  display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button:hover{color:var(--sub)}
.tabs button[aria-pressed="true"]{color:var(--text);font-weight:600}
.tabs button[aria-pressed="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:var(--accentText);border-radius:1px}
.body{flex:1;overflow-y:auto}

.cg{border:1px solid var(--cardLine);border-radius:var(--r-surface);padding:11px 12px;margin-bottom:10px;
  background:var(--card);box-shadow:var(--cardLift);transition:box-shadow .16s ease}
.cg:hover{box-shadow:var(--cardLiftHover)}
@media (prefers-reduced-motion:reduce){.cg{transition:none}}
.cghead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.cgsw{width:15px;height:15px;border-radius:var(--r-pill);border:1px solid rgba(0,0,0,.2);flex:none;cursor:pointer}
.cgid{font-size:var(--fs-strong);font-weight:600;letter-spacing:-.005em;color:var(--accentText)}
.cghex{font-family:var(--mono);font-size:var(--fs-label);color:var(--dim);letter-spacing:.02em}
.cgvis{margin-left:auto;font-size:var(--fs-meta);color:var(--dim);cursor:pointer;background:none;border:0;text-decoration:underline;text-underline-offset:2px}
.cgq{font-family:var(--mono);font-size:var(--fs-body);color:var(--sub);margin-bottom:8px;line-height:1.55}
.cgq b{color:var(--sub);font-weight:500}
.pick{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--cardLine);
  border-radius:var(--r-ctrl);background:var(--field);font-size:var(--fs-body);cursor:pointer;text-align:left;color:var(--text)}
.pick span:first-child{flex:1;line-height:1.35;text-align:left}
.pick.none span:first-child{color:var(--dim)}
.pick .chev{color:var(--dim);font-size:var(--fs-meta)}
.pickbox{margin-top:6px;border:1px solid var(--cardLine);border-radius:var(--r-surface);background:var(--card);overflow:hidden}
.picksearch{width:100%;padding:8px 10px;border:0;border-bottom:1px solid var(--line);
  background:var(--field);font-size:var(--fs-body);color:var(--text)}
.picksearch:focus{outline:none;border-bottom-color:var(--accent)}
.picklist{max-height:280px;overflow-y:auto}
.pickgroup{position:sticky;top:0;background:var(--card);font-family:var(--mono);font-size:var(--fs-label);
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:7px 10px 4px;border-bottom:1px solid var(--line)}
.pickopt{width:100%;display:flex;gap:8px;align-items:baseline;padding:7px 10px;border:0;background:none;
  cursor:pointer;text-align:left;font-size:var(--fs-body);line-height:1.35;color:var(--text)}
.pickopt:hover{background:var(--track)}
.pickopt.sel{background:var(--selBg);color:var(--accentInk)}
.pickopt .lbl{flex:1}
.pickopt .mt{font-family:var(--mono);font-size:var(--fs-meta);color:var(--dim);white-space:nowrap}

.cgres{display:flex;align-items:baseline;gap:10px;margin-top:9px}
.cgval{font-family:var(--mono);font-size:var(--fs-display);font-weight:600;letter-spacing:-.5px;color:var(--accentText)}
.cgexp{border:0;background:none;padding:0;cursor:pointer;font-size:var(--fs-meta);color:var(--dim);
  margin-left:auto;text-decoration:underline;text-underline-offset:2px}
.cgexp:hover{color:var(--accent)}
.cgcost{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.cgcost .cur{font-family:var(--mono);font-size:var(--fs-body);color:var(--dim)}
.cgcost input{width:78px;padding:5px 8px;border:1px solid var(--cardLine);border-radius:var(--r-ctrl);
  background:var(--field);font-family:var(--mono);font-size:var(--fs-body);text-align:right}
.cgcost .per{font-family:var(--mono);font-size:var(--fs-meta);color:var(--dim)}
.cgcost .tot{margin-left:auto;font-family:var(--mono);font-size:var(--fs-body);font-weight:600}

.pv{font-family:var(--mono);font-size:var(--fs-meta);border-radius:var(--r-ctrl);padding:2px 7px;white-space:nowrap}
.pv.m{color:var(--accentInk);border:1px solid var(--accent);background:var(--selBg)}
.pv.ok{color:var(--green);border:1px solid var(--green);background:transparent}
.pv.no{color:var(--dim);border:1px solid var(--line);background:transparent}
.pv.a{color:var(--ochreInk);border:1px dashed var(--ochre);background:var(--ochreBg)}
.grp{margin-top:14px}
.grphead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grphead .l{display:flex;align-items:center;gap:8px}
.grphead .n{font-size:var(--fs-meta);color:var(--dim)}
.grphead .t{font-family:var(--mono);font-size:var(--fs-meta)}
.item{border-bottom:1px solid var(--line)}
.itemrow{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:start;padding:8px 2px;
  cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--text)}
.itemrow .nm{font-size:var(--fs-body);line-height:1.35}
.itemrow .q{font-family:var(--mono);font-size:var(--fs-meta);color:var(--sub);margin-top:3px}
.itemrow .v{font-family:var(--mono);font-size:var(--fs-body);text-align:right}
.detail{background:var(--track);border-radius:var(--r-surface);padding:10px 11px;margin:0 2px 9px;font-size:var(--fs-meta);color:var(--sub);line-height:1.55}
.dupes{margin:0 0 14px;padding:10px 12px;border-radius:var(--r-surface);
  border:1px solid var(--red);background:var(--redBg);
  font-size:var(--fs-meta);color:var(--redInk);line-height:1.55}
.dupes-row{margin-top:6px;font-family:var(--mono);font-size:11.5px}
.cgerr{margin-top:9px;padding:9px 11px;border-radius:var(--r-surface);
  border:1px solid var(--red);background:var(--redBg);
  font-size:var(--fs-meta);color:var(--redInk);line-height:1.55}
.upg{margin-top:8px;padding:7px 9px;border:1px dashed var(--ochre);background:var(--ochreBg);
  border-radius:var(--r-ctrl);font-size:var(--fs-meta);color:var(--ochreInk);line-height:1.5}
.empty{padding:24px 16px;text-align:center;color:var(--dim);font-size:var(--fs-body);line-height:1.7}

/* Result tab. Every class here is prefixed rs- : this document has one global
   class pool, and short names have collided four times already. */

/* diverging plot: one shared scale either side of zero, so a bar on the left is
   directly comparable with one on the right */
/* Colour key: the one place a full assembly name is written, with room to
   wrap. Truncating it in every chart would hide exactly what separates the
   fourteen "Concrete Hardscape" variants - their wall density. */
.rs-keyRow{display:grid;grid-template-columns:11px 1fr;gap:9px;align-items:start;
  padding:3px 0}
.rs-dot{width:11px;height:11px;border-radius:50%;margin-top:3px}
.rs-full{font-size:var(--fs-body);color:var(--text);line-height:1.45}

/* a chart row: dot, plot, value - three columns that cannot overlap */
.rs-grid3{display:grid;grid-template-columns:1fr 96px;gap:7px 9px;align-items:center}
.rs-val{font-family:var(--mono);font-size:var(--fs-meta);color:var(--text);text-align:right;
  white-space:nowrap}

.rs-plot{position:relative;height:14px}
.rs-grid{position:absolute;inset:0;pointer-events:none}
.rs-grid i{position:absolute;top:-5px;bottom:-5px;width:1px;background:var(--line)}
.rs-none{padding:10px 13px 12px;font-size:var(--fs-meta);color:var(--dim);line-height:1.5}
.rs-ticks{position:relative;height:13px;
  font-family:var(--mono);font-size:var(--fs-label);color:var(--dim)}
.rs-ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* with no dot on the end, the bar is the only mark a row has - a group at
   1% of the largest would otherwise draw under a pixel and vanish */
.rs-line{position:absolute;top:4px;height:6px;border-radius:3px;min-width:6px}
.rs-rng{position:absolute;top:4px;height:6px;border-radius:3px;opacity:.32}

/* one card per chart, matching the material cards in the panel above */
.rs-card{border:1px solid var(--cardLine);border-radius:var(--r-surface);
  background:var(--card);box-shadow:var(--cardLift);margin-top:12px;overflow:hidden}
.rs-cardH{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:12px 13px 2px}
.rs-cardH .t{font-size:var(--fs-card);font-weight:600;color:var(--text);letter-spacing:-.01em}
.rs-cardH .u{font-family:var(--mono);font-size:var(--fs-label);color:var(--dim);white-space:nowrap}
.rs-body{padding:2px 13px 11px}
/* the total band reaches the card edges, so it reads as a footer not a row */
.rs-tot{display:flex;align-items:baseline;gap:12px;padding:9px 13px;
  background:var(--track);border-top:1px solid var(--line)}
.rs-tot .l{font-size:var(--fs-body);font-weight:600;color:var(--text)}
.rs-tot .v{font-family:var(--mono);font-size:var(--fs-body);color:var(--sub)}
/* the summary line under the diverging card */

/* the sixty-year curve */
.rs-chart{display:flex;gap:9px;margin-top:2px}
.rs-yax{position:relative;flex:none;width:44px;height:132px;
  font-family:var(--mono);font-size:var(--fs-label);color:var(--dim)}
.rs-yax span{position:absolute;right:0;transform:translateY(-50%);white-space:nowrap}
.rs-yax .z{color:var(--sub)}
.rs-plotcol{flex:1;min-width:0}
.rs-svg{width:100%;height:132px;display:block;overflow:visible}

/* Comparison. A full-width surface because the whole point is to see schemes
   beside each other; the 3D view has nothing to say while it is open. */
.cmp{position:fixed;left:486px;top:58px;right:64px;bottom:16px;z-index:30;
  background:var(--scene);border:1px solid var(--cardLine);border-radius:var(--r-shell);
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.cmp[hidden]{display:none}
.cmpH{display:flex;align-items:center;gap:14px;padding:13px 18px;
  border-bottom:1px solid var(--line);background:var(--card);flex:none}
.cmpH .t{font-size:var(--fs-tab);font-weight:600;color:var(--text);letter-spacing:-.01em}
.cmpH .n{font-family:var(--mono);font-size:var(--fs-label);color:var(--dim)}
/* Export takes the gap, so Close sits beside it rather than across the bar */
.cmpH .repExp+.cmpX{margin-left:0}
.repExp{margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer;
  padding:5px 11px;border:1px solid var(--cardLine);border-radius:var(--r-ctrl);
  background:var(--card);color:var(--sub);font-size:var(--fs-meta);font-weight:500}
.repExp:hover{background:var(--track);color:var(--text)}
.cmpX{margin-left:auto;border:0;background:none;color:var(--sub);cursor:pointer;
  font-size:18px;line-height:1;padding:4px 8px;border-radius:var(--r-ctrl)}
.cmpX:hover{background:var(--track);color:var(--text)}
/* the baseline every other column is read against */
/* the key reads under the plot, where it cannot sit on top of the curves */
.cmpKey{display:flex;flex-wrap:wrap;gap:6px 18px;padding-top:12px}
.cmpKeyItem{display:flex;align-items:baseline;gap:7px;font-size:var(--fs-body)}
.cmpKeyItem b{font-weight:600}
.cmpKeyItem em{font-family:var(--mono);font-size:var(--fs-label);font-style:normal;
  color:var(--dim)}
.cmpBody{flex:1;min-height:0;overflow-y:auto;padding:10px 18px 18px}
.cmpBody>.rs-card:first-child{margin-top:0}
/* the curve gets the height the full-width surface can afford: at panel height
   three schemes on one scale flatten into three near-straight lines */
.cmpBody>.rs-card:first-child .rs-svg{height:270px}
.cmpBody>.rs-card:first-child .rs-yax{height:270px}
/* the schemes sit in one panel and scroll sideways inside it, so however many
   are saved they stay a single object on the page */
.cmpPanel{margin-top:10px;border:1px solid var(--cardLine);border-radius:var(--r-shell);
  background:var(--scene);overflow:hidden}
.cmpCols{display:grid;grid-auto-flow:column;grid-auto-columns:330px;
  grid-template-rows:repeat(7,auto);overflow-x:auto;padding:14px 0}
.cmpCell{padding:0 15px 12px;min-width:0}
.cmpCell.sep{border-left:1px solid var(--line)}
.cmpCell.head{padding-bottom:2px}
/* the charts are drawn for the panel's width; in a column the tick labels run
   into each other, so every other one steps aside - the gridlines still carry
   the spacing, and the value sits beside its own bar either way */
.cmpCell .rs-ticks span:nth-of-type(even){display:none}
.cmpCell .rs-card{margin-top:0}
/* the whole heading is the baseline control - the thing it acts on is the column
   it sits on, so there is no second list of names to keep in step - and it runs
   the full width of the cards beneath it rather than hugging the words */
.cmpColH{display:flex;align-items:center;gap:6px;padding:2px 4px;
  border-radius:var(--r-ctrl)}
.cmpColH.base{background:var(--selBg)}
.cmpColH .cmpPick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;
  background:none;padding:2px 0;cursor:pointer;font-family:var(--sans);text-align:left}
.cmpColH:not(.base):hover{background:var(--track)}
.cmpColH .nm{font-size:var(--fs-card);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmpColH .tag{flex:none;font-family:var(--mono);font-size:var(--fs-label);
  letter-spacing:.06em;color:var(--accentInk)}
.cmpColH .del{margin-left:auto;border:0;background:none;color:var(--dim);cursor:pointer;
  font-size:15px;line-height:1;padding:0 3px}
.cmpColH .del:hover{color:var(--red)}
.cmpMeta{display:flex;gap:10px;font-family:var(--mono);font-size:var(--fs-label);
  color:var(--dim);padding:4px 6px 0}
.cmpDlt{font-family:var(--mono);font-size:var(--fs-meta)}
.cmpDlt.up{color:var(--red)} .cmpDlt.dn{color:var(--accentText)}
.cmpShot{width:100%;border-radius:var(--r-surface);border:1px solid var(--cardLine);
  display:block;background:var(--track)}
.cmpEmpty{padding:60px 18px;text-align:center;color:var(--dim);font-size:var(--fs-body);
  line-height:1.7}

/* Save to comparison, at the foot of the Result tab. */
.saveBar{display:flex;align-items:center;gap:8px;margin-top:12px;padding:11px 13px;
  border:1px solid var(--cardLine);border-radius:var(--r-surface);background:var(--card)}
.saveBar input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--cardLine);
  border-radius:var(--r-ctrl);background:var(--field);color:var(--text);
  font-family:var(--sans);font-size:var(--fs-body)}
.saveBar input:focus{outline:none;border-color:var(--accent)}
.saveBar button{flex:none;border:0;border-radius:var(--r-ctrl);background:var(--accent);
  color:#fff;padding:8px 14px;font-family:var(--sans);font-size:var(--fs-body);
  font-weight:600;cursor:pointer}
.saveBar button:hover{filter:brightness(1.06)}

/* collapsible blocks */
.rs-asm{border-bottom:1px solid var(--line);padding:9px 2px}
.rs-asm .t{font-size:var(--fs-body);line-height:1.4}
.rs-asm .q{font-family:var(--mono);font-size:var(--fs-meta);color:var(--sub);margin-top:3px}
.rs-fix{font-size:var(--fs-meta);color:var(--ochreInk);margin-top:5px;line-height:1.5}
.rs-note{font-size:var(--fs-meta);color:var(--dim);line-height:1.55;margin-top:9px}
.meta{font-family:var(--mono);font-size:var(--fs-meta);color:var(--dim)}
.h2{margin-top:14px;font-size:var(--fs-figure);font-weight:700;letter-spacing:-.3px}
.sub2{font-size:var(--fs-body);color:var(--sub);line-height:1.55;margin-top:4px}
.findings{margin-top:16px;padding:13px 14px;border-radius:var(--r-surface);background:var(--track);border:1px solid var(--line)}
.findings .k{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.1em;color:var(--dim);margin-bottom:7px}
.findings .x{font-size:var(--fs-body);line-height:1.65}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.kpi{border:1px solid var(--line);border-radius:var(--r-surface);padding:11px 12px}
.kpi .k{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.08em;color:var(--dim)}
.kpi .v{font-family:var(--mono);font-size:var(--fs-display);font-weight:600;letter-spacing:-.5px;margin-top:3px}
.kpi .r{font-family:var(--mono);font-size:var(--fs-label);color:var(--dim);margin-top:5px}

.project .warn{margin-top:8px;padding:8px 10px;border-radius:var(--r-ctrl);border:1px solid var(--red);
  color:var(--red);font-size:var(--fs-meta);line-height:1.5}
.projname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--fs-figure);font-weight:700;letter-spacing:-.3px;color:var(--accentText)}
.card .warn{margin-top:8px;padding:8px 10px;border-radius:var(--r-ctrl);border:1px solid var(--red);
  color:var(--red);font-size:var(--fs-meta);line-height:1.5}
.advise{margin-top:6px;padding:6px 9px;border-radius:var(--r-ctrl);border:1px dashed var(--ochre);
  background:var(--ochreBg);color:var(--ochreInk);font-size:var(--fs-meta);line-height:1.45}
.advise b{font-weight:600}
.card .t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card .t b{font-size:var(--fs-strong);font-weight:700}
.card .t span{font-family:var(--mono);font-size:var(--fs-meta);color:var(--sub)}

/* ---------------------------------------------------------------- print ---
   Only the report goes on paper. Everything else on screen is apparatus for
   working rather than for reading, and the report already carries its own
   title block, so the overlay chrome goes too. */
@media print{
  /* Paper is white whatever the screen was. All three ways of being dark are
     named because each matches with the same weight as the rule it overrides,
     and this block is last. */
  :root,
  :root[data-theme="dark"],
  :root:not([data-theme="light"]){
    --scene:#fff; --card:#fff; --track:#f5f7f8; --field:#fff; --selBg:#eaf4f3;
    --text:#14181c; --sub:#3c4650; --dim:#6b7681;
    --line:#dde3e9; --cardLine:#ccd5dd;
    --accentText:#0a6f6a; --accentFill:#0a6f6a; --green:#2f7d5b; --red:#a4344e;
    --ochre:#b8862b; --ochreBg:#f8f2e6; --ochreInk:#7d5f22;
    --redBg:#fdeef1; --redInk:#8e2a40;
    --shadow:none; --cardLift:none; --cardLiftHover:none;
  }

  body{background:#fff}
  body>*{display:none !important}
  body>#rep{display:block !important}

  /* the panel stops being a panel: no frame, no scroll, no fixed corner */
  #rep{position:static;inset:auto;width:auto;height:auto;z-index:auto;
    border:0;border-radius:0;box-shadow:none;overflow:visible;background:#fff}
  #rep .cmpH{display:none}
  #rep .cmpBody{overflow:visible;height:auto;max-height:none;padding:0}
  #rep .cmpBody>div{padding:0 !important}

  @page{margin:16mm 14mm}

  /* A chart split across two sheets is unreadable on both. */
  .rs-card,.pv,.findings,.rs-keyRow,.rs-asm,.upg{
    break-inside:avoid;page-break-inside:avoid}
  .h2{break-after:avoid;page-break-after:avoid}

  /* Backgrounds carry meaning here - the provenance tags and the bars are read
     by colour - so they must survive the browser's ink-saving default. */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<!-- Dataset and material table are served by the plugin from data/*.json,
     so the repository versions them once instead of twice. -->
<script src="/data/cc.js"></script>
<script src="/data/materials.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   PART 1 — three.js viewer.  Kept as-is from the original viewer.html:
   same r128 build, OrbitControls, lighting, grid, Z-up→Y-up convention,
   mesh building and /data.json polling.
   ═══════════════════════════════════════════════════════════════ */
var viewport = document.getElementById('viewport');
var scene = new THREE.Scene();
/* Theme colours live in the stylesheet and nowhere else. three.js wants a
   number, so the token is read and converted rather than repeated here. */
function themeColor(token){
  var v=getComputedStyle(document.documentElement).getPropertyValue(token).trim();
  var n=parseInt(v.replace('#',''),16);
  return isNaN(n)?0xffffff:n;
}
scene.background = new THREE.Color(themeColor('--scene'));

var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 100000);
camera.position.set(20, 20, 20);

var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
viewport.appendChild(renderer.domElement);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
// match Rhino: right-drag orbits, middle zooms, left pans
controls.mouseButtons = {
  LEFT:   THREE.MOUSE.PAN,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT:  THREE.MOUSE.ROTATE
};

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
var sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(10, 20, 10);
scene.add(sun);
var grid = new THREE.GridHelper(200, 40, themeColor('--grid1'), themeColor('--grid2'));
scene.add(grid);

var contentGroup = new THREE.Group();
scene.add(contentGroup);

window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();

/* Both arrays arrive flat: vertices as x,y,z triples and faces as groups of
   four indices, where the fourth repeating the third marks a triangle - the
   same shape Rhino's own MeshFace uses. Reading them in place avoids building
   an object per vertex, which is what the plugin stopped doing too. */
function buildGeometry(meshData){
  var V=meshData.vertices, F=meshData.faces;
  var geometry = new THREE.BufferGeometry(), positions = [];
  for(var i=0;i<F.length;i+=4){
    var a=F[i], b=F[i+1], c=F[i+2], d=F[i+3];
    pushTriangle(positions,V,a,b,c);
    if(d!==c) pushTriangle(positions,V,a,c,d);
  }
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  geometry.computeVertexNormals();
  return geometry;
}
/* Rhino is Z-up, three.js is Y-up: (x,y,z) becomes (x,z,-y), applied as the
   coordinates are copied rather than through a Vector3 per corner. */
function pushTriangle(out,V,a,b,c){
  var i=a*3, j=b*3, k=c*3;
  out.push(V[i],V[i+2],-V[i+1], V[j],V[j+2],-V[j+1], V[k],V[k+2],-V[k+1]);
}
/* Two option studies are only comparable if they are photographed from the same
   place, which a free orbit camera cannot promise. 'top' and 'axo' are fixed
   stations; 'fit' reframes without touching the angle you are already at. */
function frameView(kind){
  var box=new THREE.Box3().setFromObject(contentGroup);
  if(box.isEmpty()) return;
  var size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  var radius=Math.max(size.length()/2, 0.5);
  var d=radius/Math.sin(camera.fov*Math.PI/360)*1.15;
  var dir;
  if(kind==='top'){
    dir=new THREE.Vector3(0,1,0);
    // Rhino +Y maps to three -Z, so that is what "north" means on a plan
    camera.up.set(0,0,-1);
  } else {
    camera.up.set(0,1,0);
    dir = (kind==='axo')
      ? new THREE.Vector3(1,1,1).normalize()
      : camera.position.clone().sub(controls.target).normalize();
    if(!isFinite(dir.x) || dir.lengthSq()===0) dir=new THREE.Vector3(1,1,1).normalize();
  }
  camera.position.copy(center).add(dir.multiplyScalar(d));
  controls.target.copy(center);
  controls.update();
}


/* ══════════════════════════════════════════════════════════════
   PROJECT STORE
   A project is a folder the user picks:

     Park1/
       project.json      name, climate zone, display units
       schemes/001.json  one file per scheme
       thumbs/           screenshots

   The page does not touch the folder itself. Chrome's File System Access API
   refuses protected directories outright - the desktop among them - and asks
   permission again every session for the rest, so the dialog is opened by the
   plugin instead. The user still starts it from the button below: the page
   asks the server, the server asks Windows.
   ══════════════════════════════════════════════════════════════ */
var PROJ=null;                       // {name, path} once open
var SCHEMES=[];                      // this project's schemes, read from its folder
var RECENT=[];

function api(route, body){
  return fetch(route, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})
  }).then(function(r){ return r.json(); });
}

/* Dismissing the dialog is a decision, not a fault: it must leave no trace. */
function cancelled(res){ return !!res && res.cancelled; }

function adopt(res){
  if(!res || !res.ok) return res;
  var meta=res.project||{};
  PROJ={name:res.name, path:res.path, created:meta.created};
  if(meta.disp) DISP=meta.disp;
  PROJECT=meta.projectName||res.name;
  SCHEMES=(res.schemes||[]).sort(function(x,y){
    return String(x.ts).localeCompare(String(y.ts));
  });
  BASELINE=SCHEMES.length?SCHEMES[0].id:null;
  $('#welcome').hidden=true;
  paint(true);
  return res;
}

function createProject(){ return api('/project/new').then(adopt); }
function openProject(){ return api('/project/open').then(adopt); }
function openRecent(path){ return api('/project/open-recent',{path:path}).then(adopt); }

function loadRecent(){
  return api('/project/recent').then(function(r){ RECENT=(r&&r.recent)||[]; })
                               .catch(function(){ RECENT=[]; });
}

/* Saving writes project.json and one file per scheme, and removes the file of
   any scheme the page no longer holds. */
function persistSchemes(){
  if(!PROJ) return Promise.resolve();
  return api('/project/save',{
    project:{name:PROJ.name, projectName:PROJECT, disp:DISP, format:1},
    schemes:SCHEMES
  }).then(function(r){
    if(r && !r.ok) welError(r.error||'Could not write to the project folder.');
  }).catch(function(){});
}

/* ---- the welcome screen ---- */
function welError(msg){
  var e=$('#welErr');
  if(!e) return;
  e.hidden=!msg;
  e.textContent=msg||'';
}

function drawWelcome(){
  var wrap=$('#welRecWrap');
  if(wrap){
    wrap.innerHTML = '<div class="welH">RECENT</div>' + (RECENT.length
      ? RECENT.map(function(r,i){
          var d=new Date(r.opened);
          // the year is noise for this year's projects and essential for last
          // year's, so it appears only when it differs from today
          var fmt={day:'numeric',month:'short'};
          if(d.getFullYear()!==new Date().getFullYear()) fmt.year='numeric';
          return '<button class="welRec" data-rec="'+i+'" title="'+esc(r.path)+'">'+
                 '<span>'+esc(r.name)+'</span>'+
                 '<span class="welMeta">'+r.schemes+' scheme'+(r.schemes===1?'':'s')+' · '+
                 d.toLocaleDateString('en-GB',fmt)+'</span></button>';
        }).join('')
      : '<div class="welNone">No projects opened yet</div>');
    wrap.querySelectorAll('[data-rec]').forEach(function(b){
      b.onclick=function(){
        welError('');
        var r=RECENT[+b.dataset.rec];
        openRecent(r.path).then(function(res){
          if(res && !res.ok && !cancelled(res)) welError(res.error||'Could not open that project.');
        });
      };
    });
  }
}


/* ═══════════════════════════════════════════════════════════════
   PART 2 — quantities.
   The plugin already sends everything we need, and its rule is the simple
   one: Point→count, Curve→length, Surface→area, and a Brep/Mesh that is a
   closed solid additionally gets volume. So volume>0 IS the "this is a solid"
   test — no face-normal analysis needed.

     solid   -> volume  (its real thickness is modelled, so we use it)
     surface -> area    (thickness is not modelled, so it stays an assumption)

   Carbon Conscience's concrete factors are purely volumetric — 1116.8 kg/m³
   across 100/150/200 mm, and its "1M retaining wall + 1M footer" is exactly
   1116.8 × 2.0 m³ — so volume maps onto them directly.
   ═══════════════════════════════════════════════════════════════ */
var WALL_M3_PER_UNIT = 2.0;    // 033001.04 = 1 m³ wall + 1 m³ spread footing

/* ═══════════════════════════════════════════════════════════════
   PART 3 — resolver.  Same rules as the prototype, against the full
   Carbon Conscience V2 set (192 assemblies / 214 elements).
   ═══════════════════════════════════════════════════════════════ */
var WALL_1M='033001.04', WALL_1M_RB='033001.22', WALL_2M='033001.05', WALL_2M_RB='033001.23';
var TREEPLANT={'329300.07':1,'329300.08':1};
var CANOPY={'329300.28':144,'329300.29':36,'329300.30':16};
var TREE_CURVE=[[144,-383.2],[36,-202.8],[16,-136.2]];
function perTree(m2){
  var P=TREE_CURVE;
  if(m2>=P[0][0]) return {v:P[0][1],clamp:true};
  if(m2<=P[2][0]) return {v:P[2][1],clamp:true};
  for(var i=0;i<P.length-1;i++){
    var x1=P[i][0],y1=P[i][1],x2=P[i+1][0],y2=P[i+1][1];
    if(m2<=x1&&m2>=x2) return {v:y1+(m2-x1)/(x2-x1)*(y2-y1),clamp:false};
  }
  return {v:P[2][1],clamp:true};
}

function resolve(cg){
  var ref=priced(cg);
  if(!ref) return {ref:null,items:[],notes:[]};

  if(ref.indexOf('mat:')===0){                 // solid priced by its own volume
    var key=ref.slice(4), m=MAT[key];
    if(!m) return {ref:null,items:[],notes:[]};
    var V0=cg.qty.volume;
    /* A material carries its own stored and sequestered figures. These were
       hard-coded to zero, which silently discarded the biogenic carbon in
       timber: Carbon Conscience counts half the dry biomass of sustainably
       sourced wood as stored carbon, so a timber deck modelled as a solid was
       being shown as pure emission. A material with nothing to store simply
       has no figure, which is the honest answer for steel or concrete. */
    return {ref:ref, lu:null, material:key, items:[{
      id:'mat:'+key, e:{d:key, csi:'by volume',
      lo:m.lo, me:m.me, hi:m.hi, sq:m.sq||0, st:m.st||0}, pct:1, qty:V0, prov:'m', u:'V'}],
      treeSeq:0, treeInfo:null,
      notes:[]};
  }

  var lu=CC.landuses[ref];
  if(!lu) return {ref:null,items:[],notes:[]};

  var A=cg.qty.surfArea;                  // ground area only — never a solid's skin
  var V=cg.qty.volume;                     // solids: real modelled volume
  var wallUnits=V>0?V/WALL_M3_PER_UNIT:0;  // 033001.04 == 2.0 m3
  var items=[], notes=[];

  lu.sub.forEach(function(p){
    var pct=p[0], id=p[1], e=CC.elements[id];
    if(!e) return;
    var qty, prov;
    if(id===WALL_1M||id===WALL_1M_RB){ qty=wallUnits; prov=V>0?'m':'a'; }
    else if(TREEPLANT[id]&&cg.qty.count>0){ qty=cg.qty.count*10; prov='m'; }
    else if(CANOPY[id]&&cg.qty.count>0){ qty=0; prov='m'; }
    else { qty=A*pct; prov='a'; }   // area x published percentage
    items.push({id:id,e:e,pct:pct,qty:qty,prov:prov});
  });



  var treeSeq=0, treeInfo=null;
  if(cg.qty.count>0 && lu.sub.some(function(p){return CANOPY[p[1]];})){
    var m2=A/cg.qty.count, pt=perTree(m2);
    treeSeq=pt.v*cg.qty.count;
    treeInfo={m2:m2,spacing:Math.sqrt(m2),per:pt.v,n:cg.qty.count,clamp:pt.clamp};

  }
  return {ref:ref,lu:lu,items:items,treeSeq:treeSeq,treeInfo:treeInfo,notes:notes};
}
function carbon(r){
  var o={lo:0,me:0,hi:0,sq:0,st:0};
  r.items.forEach(function(it){
    var L=it.e.lo,M=it.e.me,H=it.e.hi;
    if(it.mix){var t=it.mix.t,m=it.mix.el; L+=(m.lo-L)*t; M+=(m.me-M)*t; H+=(m.hi-H)*t;}
    o.lo+=L*it.qty; o.me+=M*it.qty; o.hi+=H*it.qty;
    o.sq+=it.e.sq*it.qty; o.st+=it.e.st*it.qty;
  });
  o.sq+=r.treeSeq||0;
  return o;
}
function curve(total,maturity){
  var r=8/maturity,t0=maturity/2,f=function(t){return 1/(1+Math.exp(-r*(t-t0)));};
  var f0=f(0),f60=f(60),out=[];
  for(var t=0;t<=60;t++) out.push(total*((f(t)-f0)/(f60-f0)));
  return out;
}

/* ═══════════════════════════════════════════════════════════════
   PART 4 — state + UI
   ═══════════════════════════════════════════════════════════════ */
/* ── display units ────────────────────────────────────────────────
   Everything is computed in metres — the geometry arrives in metres and the
   Carbon Conscience factors are per m²/m³. These multipliers are presentation
   only; nothing below them ever feeds a calculation.                        */
/* MAT arrives from /data/materials.js */
var UNITS={
  m : {name:'Meters (m)',      len:1,            area:1,           vol:1,            L:'m',  A:'m²',  V:'m³',  dp:[0,1]},
  cm: {name:'Centimeters (cm)',len:100,          area:1e4,         vol:1e6,          L:'cm', A:'cm²', V:'cm³', dp:[0,0]},
  mm: {name:'Millimeters (mm)',len:1000,         area:1e6,         vol:1e9,          L:'mm', A:'mm²', V:'mm³', dp:[0,0]},
  ft: {name:'Feet (ft)',       len:3.280839895,  area:10.76391042, vol:35.31466672,  L:'ft', A:'ft²', V:'ft³', dp:[0,1]},
  in: {name:'Inches (in)',     len:39.37007874,  area:1550.0031,   vol:61023.74409,  L:'in', A:'in²', V:'in³', dp:[0,0]},
  yd: {name:'Yards (yd)',      len:1.093613298,  area:1.195990046, vol:1.307950619,  L:'yd', A:'yd²', V:'yd³', dp:[0,1]}
};
var DISP='m';

/* What a colour group IS decides what you can pick for it and how it is priced.
   A landuse assembly ("Pedestrian Concrete Hardscape") is defined per m2 of
   ground and bundles paving + base + drainage + lighting. Applying that to a
   pile of solids is meaningless, so solids get a per-m3 material instead. */
/* Read an assignment through here, never from ASSIGN directly: a mixed group
   has no basis to price on, so it reports as unassigned everywhere until the
   model is split. The stored choice is kept, not deleted - fix the geometry
   and the material comes back. */
function priced(cg){ return groupKind(cg)==='mixed' ? null : ASSIGN[cg.color]; }

function groupKind(cg){
  if(cg.qty.solids>0 && cg.qty.surfaces===0) return 'solid';
  if(cg.qty.surfaces>0 && cg.qty.solids===0) return 'surface';
  return cg.qty.solids>0?'mixed':'surface';
}
var MATLIST=Object.keys(MAT).sort(function(a,b){return MAT[a].me-MAT[b].me;}).map(function(k){
  return {v:'mat:'+k, label:k, meta:Math.round(MAT[k].me)+' kg/m³', group:'By volume'};
});

/* RATE[] is always stored as $ per m2 so the maths never depends on what the
   user is looking at. The input box shows and accepts $ per display unit. */
function rateToDisplay(r,solid){ if(r==null||r==='') return '';
  var v=Number(r)/(solid?U().vol:U().area); return String(+v.toPrecision(6)); }
function rateToCanonical(v,solid){ if(v==null||v==='') return '';
  return Number(v)*(solid?U().vol:U().area); }
function perLabel(kgPerM2){
  var u=U(), v=kgPerM2/u.area;
  var dp = v>=100?0 : v>=10?1 : v>=1?2 : 4;
  return num(v,dp)+' kg/'+u.A;
}

function U(){ return UNITS[DISP]||UNITS.m; }
function num(v,dp){ return v.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function fmtA(m2){ var u=U(); return num(m2*u.area,u.dp[0])+' '+u.A; }        // area
function fmtV(m3){ var u=U(); return num(m3*u.vol ,u.dp[1])+' '+u.V; }        // volume
function areaVal(m2){ var u=U(); return num(m2*u.area,u.dp[0]); }
function volVal(m3){ var u=U(); return num(m3*u.vol ,u.dp[1]); }

var MODEL={meta:null,groups:[]}, ASSIGN={}, RATE={}, VIS={};
var UI={tab:'mat',open:{},theme:'light',picker:null,mode:'colour',
        grid:true,pal:'magma',pop:null,res:{},cmp:false,rep:false};
var PROJECT='Untitled project';
var $=function(s){return document.querySelector(s);};
function t1(v){return (v/1000).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(v){ return '$ '+Math.round(v||0).toLocaleString('en-US'); }
function costLabel(r,a){ return money((r==null||r==='')?0:Number(r)*a); }
var PVN={m:'Measured',a:'Reference',o:'Overridden'};
var DATASET='Carbon Conscience V2 (Sasaki, 2023)';
var ORIGIN={
  m:'Quantity taken off your Rhino geometry. Revise the model to change it.',
  a:'Quantity from the published assembly in '+DATASET+', scaled to your measured area. '+
    'Your model does not yet define this element.',
  o:'Value you entered, replacing the published figure. Flagged as such in every export.'
};


/* Ecosystem assemblies. Sixteen ecosystem types each appear three times in the
   dataset — once to retain, once to clear, once to restore — which is where
   48 of the 193 assemblies come from. Which of them are plausible is a property
   of where the project is, not a design decision, so the climate zone decides
   it once instead of the user picking from all sixteen every time. */
var ECOSYSTEMS=['Tropical Rainforest','Tropical Moist Deciduous','Tropical Dry Deciduous',
  'Tropical Shrublands','Mangrove','Peat Swamp','Subtropical Humid Forest',
  'Dry Forest (Mediterranean)','Temperate Oceanic Rainforest','Temperate Continental Forest',
  'Boreal Forest','Prairie Grassland','Dry Meadows','Temperate Mixed Shrub and Forb Landscape',
  'Temperate Wetland and Salt Marsh','Turf'];


/* the ecosystem an assembly describes, or null if it is not an ecosystem */
/* assigned assemblies whose ecosystem does not belong in the chosen zone —
   changing the zone does not silently rewrite a choice the user already made,
   so the mismatch has to be surfaced instead */

var FAMLIST=(function(){
  var tiers={}, out=[];
  Object.keys(CC.landuses).forEach(function(ref){
    var t=CC.landuses[ref].t[0];
    (tiers[t]=tiers[t]||[]).push(ref);
  });
  ['Hardscape','Softscape','Existing to Remain','Demolition and Preparation']
    .filter(function(t){return tiers[t];})
    .forEach(function(t){
      tiers[t].forEach(function(ref){
        var nm=CC.landuses[ref].n;
        out.push({v:ref, label:nm, meta:'', group:t});
      });
    });
  return out;
})();

function siteTotals(){
  var o={lo:0,me:0,hi:0,sq:0,st:0,area:0,cost:0,anyCost:false};
  MODEL.groups.forEach(function(cg){
    var c=carbon(resolve(cg));
    o.lo+=c.lo;o.me+=c.me;o.hi+=c.hi;o.sq+=c.sq;o.st+=c.st;
    o.area+=cg.qty.surfArea;      // ground area only; a solid's skin is not a plot
    var r=RATE[cg.color];
    if(r!=null&&r!==''){
      o.cost+=Number(r)*(groupKind(cg)==='solid'?cg.qty.volume:cg.qty.surfArea);
      o.anyCost=true;
    }
  });
  return o;
}


/* Material picker. A native <select> truncates long names and cannot be
   searched, and 192 assemblies is far too many to scroll. This renders the
   list inline and filters it in place — filtering never calls paint(), so
   the open list and the caret survive the background sync. */
function pickerLabel(kind, ref){
  if(!ref) return null;
  if(ref.indexOf('mat:')===0){
    var k=ref.slice(4);
    return MAT[k] ? k+'  ('+Math.round(MAT[k].me)+' kg/m\u00b3)' : k;
  }
  return (CC.landuses[ref]||{}).n || ref;
}
function picker(cg, kind, ref){
  var open=(UI.picker===cg.color);
  var label=pickerLabel(kind, ref);
  var h='<button class="pick'+(ref?'':' none')+'" data-pick="'+cg.color+'">'+
        '<span>'+(label?esc(label):'Select a material')+'</span>'+
        '<span class="chev">'+(open?'\u25b4':'\u25be')+'</span></button>';
  if(!open) return h;

  var list=(kind==='solid')?MATLIST:FAMLIST;
  h+='<div class="pickbox">'+
     '<input class="picksearch" type="text" data-search="'+cg.color+'" placeholder="Search '+
     list.length+' options" autocomplete="off">'+
     '<div class="picklist" data-list="'+cg.color+'">';
  var lastGroup=null;
  list.forEach(function(o){
    if(o.group!==lastGroup){
      lastGroup=o.group;
      h+='<div class="pickgroup" data-g="'+esc(o.group)+'">'+esc(o.group)+'</div>';
    }
    h+='<button class="pickopt'+(o.v===ref?' sel':'')+'" data-opt="'+esc(o.v)+
       '" data-col="'+cg.color+'" data-t="'+esc((o.label+' '+o.meta).toLowerCase())+'">'+
       '<span class="lbl">'+esc(o.label)+'</span>'+
       (o.meta?'<span class="mt">'+esc(o.meta)+'</span>':'')+'</button>';
  });
  return h+'</div></div>';
}

/* Shown above the colour cards rather than on one of them: the fault belongs to
   a pair of groups, not to either one. */
function dupeNote(){
  var d=MODEL.dupes;
  if(!d) return '';
  var rows=Object.keys(d.combos).map(function(k){
    var c=d.combos[k], bits=[];
    if(c.area>0)   bits.push(areaVal(c.area)+' '+U().A);
    if(c.volume>0) bits.push(volVal(c.volume)+' '+U().V);
    return '<div class="dupes-row">'+esc(k)+' \u2014 '+c.count+
           (c.count===1?' object':' objects')+(bits.length?' ('+bits.join(', ')+')':'')+'</div>';
  }).join('');
  return '<div class="dupes"><b>'+d.total+(d.total===1?' object reaches':' objects reach')+
    ' the viewer more than once.</b> Anything priced on both sides is added to the '+
    'total twice. Give each object one colour in Grasshopper.'+rows+'</div>';
}

function matTab(){
  if(!MODEL.groups.length) return '<div class="empty">No colour groups yet.<br>Add geometry to a <b>CC Group</b> component and toggle <b>Run</b> on <b>CC Sync</b>.</div>';
  var h='<div style="padding:12px 14px 20px">'+dupeNote();
  MODEL.groups.forEach(function(cg){
    var ref=priced(cg), open=UI.open[cg.color], q=cg.qty, kind=groupKind(cg);
    var A=q.surfArea;   // ground area only — a solid's boundary skin is not a plot area
    var qparts=[];
    if(q.surfaces>0) qparts.push('<b>'+areaVal(q.surfArea)+'</b> '+U().A);
    if(q.solids>0)   qparts.push('<b>'+volVal(q.volume)+'</b> '+U().V);
    if(q.length>0)   qparts.push('<b>'+num(q.length*U().len,U().dp[0])+'</b> '+U().L);
    h+='<div class="cg">'+
       '<div class="cghead"><span class="cgsw" style="background:'+cg.color+'" data-iso="'+cg.color+'" title="Isolate"></span>'+
       '<span class="cgid">'+esc(cg.label||cg.color)+'</span>'+
       (cg.label?'<span class="cghex">'+esc(cg.color)+'</span>':'')+
       '<button class="cgvis" data-vis="'+cg.color+'">'+(VIS[cg.color]===false?'show':'hide')+'</button></div>'+
       '<div class="cgq">'+qparts.join(' · ')+'</div>';
    if(kind==='mixed'){
      h+='<div class="cgerr"><b>Mixed group — not counted.</b> '+
         q.solids+' closed '+(q.solids===1?'solid':'solids')+' and '+
         q.surfaces+' open '+(q.surfaces===1?'surface':'surfaces')+
         ' share this colour. A solid is priced per '+U().V+' and a surface per '+
         U().A+', so this group has no single basis. Give them two colours in '+
         'Grasshopper.</div>';
      h+='</div>';
      return;
    }
    h+=picker(cg, kind, ref);
    if(ref){
      var r=resolve(cg), c=carbon(r);
      var n=r.items.filter(function(i){return i.qty>0;}).length;
      h+='<div class="cgres"><span class="cgval"'+(c.me<0?' style="color:var(--green)"':'')+'>'+t1(c.me)+' t</span>'+
         '<button class="cgexp" data-exp="'+cg.color+'">'+(open?'hide':n+(n===1?' element':' elements'))+'</button></div>';
      var rate=RATE[cg.color], solid=(kind==='solid');
      var basis=solid?cg.qty.volume:A;
      h+='<div class="cgcost"><span class="cur">$</span>'+
         '<input type="number" min="0" step="any" data-cost="'+cg.color+'" value="'+rateToDisplay(rate,solid)+'">'+
         '<span class="per">/ '+(solid?U().V:U().A)+'</span>'+
         '<span class="tot" id="ct-'+cg.color.slice(1)+'">'+costLabel(rate,basis)+'</span></div>';
      if(open) h+=breakdown(cg,r);
    }
    h+='</div>';
  });
  return h+'</div>';
}

function breakdown(cg,r){
  var by={m:[],i:[],a:[]}, sums={m:0,i:0,a:0};
  r.items.forEach(function(it){ if(it.qty>0){ by[it.prov].push(it); sums[it.prov]+=it.e.me*it.qty; } });
  var h='<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:4px">';
  ['m','i','a'].forEach(function(p){
    if(!by[p].length) return;
    var note={m:'model takeoff',a:'published assembly',o:'user value'}[p];
    h+='<div class="grp"><div class="grphead"><div class="l"><span class="pv '+p+'">'+PVN[p]+'</span>'+
       '<span class="n">'+note+'</span></div><span class="t">'+t1(sums[p])+' t</span></div>';
    by[p].sort(function(a,b){return Math.abs(b.e.me*b.qty)-Math.abs(a.e.me*a.qty);}).forEach(function(it){
      var v=it.e.me*it.qty, k=cg.color+'|'+it.id;
      var unit=(it.u==='V')?U().V:U().A;
      var q=(it.u==='V')?it.qty*U().vol:it.qty*U().area;      // display units
      var f=(it.u==='V')?it.e.me/U().vol :it.e.me/U().area;   // kg per display unit
      h+='<div class="item"><button class="itemrow" data-k="'+k+'" title="'+esc(it.e.d)+'">'+
        '<span><span class="nm">'+esc(it.e.d)+'</span>'+
        '<span class="q" style="display:block">'+num(q,2)+' '+unit+
        ' × '+num(f,f<1?3:1)+' kg/'+unit+'</span></span>'+
        '<span class="v"'+(v<0?' style="color:var(--green)"':'')+'>'+num(v/1000,2)+' t</span></button>'+
        (UI.open[k]?('<div class="detail">'+ORIGIN[it.prov]+
          (it.prov==='a'?'<div class="upg">Model this in Rhino and it becomes Measured — the assumption leaves your report.</div>':'')+'</div>'):'')+
        '</div>';
    });
    h+='</div>';
  });
  return h+'</div>';
}
/* Rows for the diverging plot and the account charts: one entry per assigned
   colour group, carrying the group's own Rhino colour so a bar here is the same
   colour as the object in the viewport. */
/* Rows for every chart on this tab. Sorted once, by embodied carbon, and used
   in that same order everywhere: with the names living in the colour key rather
   than on each bar, a row's position is how you know which group it is. */
function resRows(){
  return MODEL.groups.filter(function(cg){ return priced(cg); }).map(function(cg){
    var r=resolve(cg), c=carbon(r), ref=priced(cg);
    var rate=RATE[cg.color];
    var basis=(groupKind(cg)==='solid')?cg.qty.volume:cg.qty.surfArea;
    return {
      color:cg.color,
      name:r.material?r.material:((CC.landuses[ref]||{}).n||ref),
      me:c.me, lo:c.lo, hi:c.hi, sq:c.sq, st:c.st,
      cost:(rate==null||rate==='')?null:Number(rate)*basis
    };
  }).sort(function(x,y){ return Math.abs(y.me)-Math.abs(x.me); });
}

function colourKey(rows){
  var h='<div class="rs-card"><div class="rs-cardH"><span class="t">Colour Key</span></div>'+
        '<div class="rs-body">';
  rows.forEach(function(r){
    h+='<div class="rs-keyRow"><span class="rs-dot" style="background:'+esc(r.color)+
       '" title="'+esc(r.color)+'"></span>'+
       '<div class="rs-full">'+esc(r.name)+'</div></div>';
  });
  return h+'</div></div>';
}

/* Tick marks a reader can actually use: a round step near a quarter of the span. */
function niceStep(span){
  if(span<=0) return 1;
  var raw=span/4, mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), n=raw/mag;
  return (n<1.5?1:n<3.5?2:n<7.5?5:10)*mag;
}
function gridAndTicks(negMax,posMax,fmt){
  var span=negMax+posMax;
  if(span<=0) return {grid:'',ticks:''};
  var step=niceStep(span), g='', t=[], v;
  for(v=-Math.ceil(negMax/step)*step; v<=posMax+1e-9; v+=step){
    var x=((v+negMax)/span)*100;
    if(x<-0.01||x>100.01) continue;
    g+='<i style="left:'+x.toFixed(2)+'%"></i>';
    t.push({x:x, s:fmt(Math.abs(v))});
  }
  return {grid:'<div class="rs-grid">'+g+'</div>',
          ticks:'<div class="rs-ticks">'+t.map(function(o){
            var a=o.x<2?'left:0;transform:none':o.x>98?'right:0;left:auto;transform:none'
                                                     :'left:'+o.x.toFixed(2)+'%';
            return '<span style="'+a+'">'+esc(o.s)+'</span>';
          }).join('')+'</div><div></div>'};
}

/* One chart row: a dot, the plot, the value. Three grid columns, so a long
   number can never land on top of a bar. */
function chartRow(r, bars, val){
  return '<div class="rs-plot" title="'+esc(r.name)+'">'+bars+'</div>'+
         '<span class="rs-val" title="'+esc(r.name)+'">'+esc(val)+'</span>';
}
function barSpans(color, parts){
  var h='';
  parts.forEach(function(pt){
    if(pt.w>0)
      h+='<span class="'+(pt.range?'rs-rng':'rs-line')+'" style="background:'+esc(color)+
         ';left:'+pt.x.toFixed(2)+'%;width:'+pt.w.toFixed(2)+'%"></span>';
  });
  return h;
}

/* Each account gets its own scale. A shared one buries the small accounts -
   sequestration is routinely a hundredth of emissions - and the comparison
   between accounts is what the diverging card above is for. */
var ACCOUNTS=[
  {k:'me', n:'Embodied Carbon',    sign:1,
   none:'Nothing here emits carbon.'},
  {k:'sq', n:'Carbon Sequestered', sign:-1,
   none:'Nothing here takes carbon back out of the air over the study period.'},
  {k:'st', n:'Carbon Stored',      sign:-1,
   none:'Nothing here holds carbon from day one — no timber, no retained planting.'}
];

/* An account with nothing in it still gets a card, shorter and without a plot.
   Dropping it would leave the reader with no way to tell "this scheme does not
   touch that account" from "this tool does not have that account", and those
   are very different facts. */
function emptyAccountCard(title, unit, why){
  return '<div class="rs-card"><div class="rs-cardH"><span class="t">'+esc(title)+'</span>'+
         '<span class="u">'+unit+'</span></div>'+
         '<div class="rs-none">'+esc(why)+'</div></div>';
}
/* One card. Returns '' when the scheme has nothing in this account - the
   comparison grid puts an empty cell there so the row below still lines up. */
function accountChart(rows, key){
  var h='';
  if(key!=='cost') ACCOUNTS.filter(function(a){ return a.k===key; }).forEach(function(a){
    var live=rows.filter(function(r){ return Math.abs(r[a.k]||0)>0; });
    if(!live.length){ h+=emptyAccountCard(a.n, 't CO₂e', a.none); return; }
    var max=0, tot=0;
    live.forEach(function(r){ var v=Math.abs(r[a.k]||0); if(v>max) max=v; tot+=(r[a.k]||0); });
    var gt=gridAndTicks(0,max,function(v){ return t1(v); });
    h+='<div class="rs-card"><div class="rs-cardH"><span class="t">'+a.n+'</span>'+
       '<span class="u">t CO₂e · 0–'+t1(max)+'</span></div>'+
       '<div class="rs-body"><div class="rs-grid3">';
    live.forEach(function(r){
      var v=Math.abs(r[a.k]||0), w=(v/max)*100;
      h+=chartRow(r, gt.grid+barSpans(r.color,[{x:0,w:w}]),
                  (a.sign<0?'−':'')+t1(v)+' t');
    });
    h+=gt.ticks+'</div></div>'+
       '<div class="rs-tot"><span class="l">Total</span><span class="v">'+
       (tot<0?'−':'')+t1(Math.abs(tot))+' t</span></div></div>';
  });
  if(key!=='cost') return h;

  // cost is money, so it never shared a carbon axis in the first place
  var priced=rows.filter(function(r){ return r.cost!=null; });
  if(!priced.length){
    return h+emptyAccountCard('Cost', '$',
      'No rate entered yet. Type one under a material in the Materials tab.');
  }
  var cmax=0, ctot=0;
  priced.forEach(function(r){ ctot+=r.cost; if(Math.abs(r.cost)>cmax) cmax=Math.abs(r.cost); });
  if(priced.length){
    var cg=gridAndTicks(0,cmax,function(v){ return money(v).replace('$ ','$'); });
    h+='<div class="rs-card"><div class="rs-cardH"><span class="t">Cost</span>'+
       '<span class="u">$0–'+money(cmax).replace('$ ','')+'</span></div>'+
       '<div class="rs-body"><div class="rs-grid3">';
    priced.forEach(function(r){
      var w=cmax>0?(Math.abs(r.cost)/cmax)*100:0;
      h+=chartRow(r, cg.grid+barSpans(r.color,[{x:0,w:w}]), money(r.cost));
    });
    h+=cg.ticks+'</div></div>'+
       '<div class="rs-tot"><span class="l">Total</span><span class="v">'+esc(money(ctot))+'</span>'+
       // a total that quietly omits groups is worse than no total
       (priced.length<rows.length
         ? ('<span class="l" style="margin-left:auto;color:var(--ochreInk)">'+
            (rows.length-priced.length)+' of '+rows.length+' groups have no rate</span>')
         : '')+'</div></div>';
  }
  return h;
}
function accountCharts(rows){
  return ACCOUNTS.map(function(a){ return accountChart(rows,a.k); }).join('')+
         accountChart(rows,'cost');
}

/* Cumulative net carbon across the study period. One series rather than a
   breakdown, so it carries no colour key - but it wears the same card, grid,
   tick row and footer band as every other chart on this tab. */
function curveCard(t){
  var y0=t.me+t.st, cv=curve(t.sq,80), pts=[];
  for(var y=0;y<=60;y++) pts.push(y0+cv[y]);
  var top=Math.max.apply(null,pts), bot=Math.min.apply(null,pts);
  if(top<0) top=0;
  if(bot>0) bot=0;
  var span=(top-bot)||1, pad=4;
  var X=function(y){ return (y/60)*100; };
  var Y=function(v){ return pad+((top-v)/span)*(100-pad*2); };
  var d=pts.map(function(v,y){ return (y?'L':'M')+X(y).toFixed(2)+' '+Y(v).toFixed(2); }).join(' ');

  /* Break-even falls between two whole years. Reporting the first year the
     curve happens to be negative turns a crossing at 30.0 into "year 31". */
  var be=null;
  for(var i=1;i<=60;i++){
    if(pts[i-1]>0 && pts[i]<=0){ be=i-1+pts[i-1]/(pts[i-1]-pts[i]); break; }
  }

  var zy=Y(0);
  var yax='<span style="top:'+Y(top).toFixed(2)+'%">'+t1(top)+'</span>';
  if(zy>Y(top)+9 && zy<Y(bot)-9) yax+='<span class="z" style="top:'+zy.toFixed(2)+'%">0</span>';
  yax+='<span style="top:'+Y(bot).toFixed(2)+'%">'+t1(bot)+'</span>';

  var grid='', ticks='';
  [0,15,30,45,60].forEach(function(y){
    var x=X(y).toFixed(2);
    grid+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="100" stroke="var(--line)" '+
          'stroke-width="1" vector-effect="non-scaling-stroke"/>';
    ticks+='<span style="'+(y===0?'left:0;transform:none'
                          :y===60?'right:0;left:auto;transform:none'
                                 :'left:'+x+'%')+'">'+y+'</span>';
  });

  var h='<div class="rs-card"><div class="rs-cardH">'+
        '<span class="t">Cumulative Net Carbon</span>'+
        '<span class="u">t CO\u2082e \u00b7 60 yr</span></div>'+
        '<div class="rs-body"><div class="rs-chart">'+
        '<div class="rs-yax">'+yax+'</div>'+
        '<div class="rs-plotcol">'+
        '<svg class="rs-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+
        grid+
        '<line x1="0" y1="'+zy.toFixed(2)+'" x2="100" y2="'+zy.toFixed(2)+'" '+
          'stroke="var(--sub)" stroke-width="1" opacity=".55" vector-effect="non-scaling-stroke"/>';
  if(be!=null)
    h+='<line x1="'+X(be).toFixed(2)+'" y1="0" x2="'+X(be).toFixed(2)+'" y2="100" '+
       'stroke="var(--ochre)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  h+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="3" '+
     'vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>'+
     '</svg><div class="rs-ticks">'+ticks+'</div></div></div></div>'+
     '<div class="rs-tot"><span class="l">Break-even</span><span class="v">'+
     (be==null?'not within 60 years':'year '+Math.round(be))+'</span>'+
     '<span class="l" style="margin-left:auto">net at 60</span>'+
     '<span class="v">'+t1(pts[60])+' t</span></div></div>';
  return h;
}

/* Every quantity the model did not supply, with what would replace it. */
function assumptionList(){
  var by={};
  MODEL.groups.forEach(function(cg){
    if(!priced(cg)) return;
    resolve(cg).items.forEach(function(it){
      if(it.prov!=='a' || it.qty<=0) return;
      var k=it.e.d;
      if(!by[k]) by[k]={d:it.e.d, csi:it.e.csi, qty:0, kg:0, u:it.u||'A'};
      by[k].qty+=it.qty;
      by[k].kg+=it.e.me*it.qty;
    });
  });
  var list=Object.keys(by).map(function(k){ return by[k]; })
    .sort(function(a,b){ return Math.abs(b.kg)-Math.abs(a.kg); });
  if(!list.length) return '';
  var h='<p class="rs-fix">Each of these quantities comes from the published assembly, '+
        'scaled to your measured area — your model does not define them yet. Draw any of '+
        'them in Rhino under its own colour and it becomes a measured quantity.</p>';
  list.slice(0,12).forEach(function(a){
    var uq=(a.u==='V')?fmtV(a.qty):(a.u==='C')?(num(a.qty,0)+' ea'):fmtA(a.qty);
    var div=String(a.csi).split(' - ')[1]||String(a.csi);
    h+='<div class="rs-asm"><div class="t">'+esc(String(a.d).slice(0,80))+'</div>'+
       '<div class="q">'+esc(uq)+' \u00b7 '+t1(a.kg)+' t \u00b7 '+esc(div.slice(0,34))+'</div>'+
       '</div>';
  });
  if(list.length>12) h+='<p class="rs-note">'+(list.length-12)+' further assumed elements not listed.</p>';
  return h;
}

function resTab(){
  if(!MODEL.groups.length) return '<div class="empty">No model yet.</div>';
  var rows=resRows();
  if(!rows.length) return '<div class="empty">Nothing to report yet.<br>Assign a material to at least one colour in <b>Materials</b>.</div>';

  var t=siteTotals();

  var h='<div style="padding:2px 16px 28px">';
  h+=colourKey(rows);
  h+=accountCharts(rows);

  h+=curveCard(t);

  h+='<div class="saveBar"><input id="cmpName" type="text" maxlength="40" '+
     'placeholder="Name this scheme" autocomplete="off">'+
     '<button id="cmpSave">Save to comparison</button></div>';

  return h+'</div>';
}

var paintPending=false;
function panelBusy(){
  var ae=document.activeElement;
  if(!ae) return false;
  var body=$('#panelBody');
  if(!body||!body.contains(ae)) return false;
  return ae.tagName==='SELECT'||ae.tagName==='INPUT';
}

/* Report tab. Reads as a document you could hand over: what is on the site,
   what it emits, and — the part that decides whether anyone trusts it —
   which figures came from the model versus Carbon Conscience defaults. */
function repTab(){
  if(!MODEL.groups.length) return '<div class="empty">No model yet.</div>';
  var assigned=MODEL.groups.filter(function(g){return priced(g);});
  if(!assigned.length) return '<div class="empty">Nothing to report yet.<br>Assign a material in <b>Materials</b> first.</div>';

  var t=siteTotals(), net=t.me+t.sq+t.st;
  var prov={m:0,a:0,o:0}, provKg={m:0,a:0,o:0};
  MODEL.groups.forEach(function(cg){
    resolve(cg).items.forEach(function(it){
      if(it.qty<=0) return;
      var k=(it.prov in prov)?it.prov:'a';
      prov[k]+=1;
      provKg[k]+=it.e.me*it.qty;
    });
  });
  var totKg=Math.abs(provKg.m)+Math.abs(provKg.a)+Math.abs(provKg.o)||1;
  // a real but tiny share must not read as a flat zero
  function pc(k){ return Math.round(Math.abs(provKg[k])/totKg*100); }
  function pcLabel(k){
    var v=Math.abs(provKg[k])/totKg*100;
    return (v>0 && v<0.5) ? '&lt;1%' : Math.round(v)+'%';
  }

  var h='<div style="padding:14px 16px 24px">';

  h+='<div class="meta">CARBON REPORT \u00b7 DRAFT \u00b7 '+
     new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+'</div>';
  h+='<div class="h2">'+esc(PROJECT)+'</div>';
  h+='<p class="sub2">'+fmtA(t.area)+' of ground \u00b7 '+MODEL.groups.length+' colour groups \u00b7 '+
     assigned.length+' assigned \u00b7 60-year horizon \u00b7 Carbon Conscience V2 (2023)</p>';

  var y0=t.me+t.st, cv=curve(t.sq,80), ny=null;
  for(var y=0;y<=60;y++){ if(y0+cv[y]<=0){ ny=y; break; } }
  var per=t.area>0?t.me/t.area:0;

  h+='<div class="findings"><div class="k">FINDINGS</div><div class="x">This scheme emits <b>'+
     t1(t.me)+' t</b>'+
     (t.sq?(', planting takes back <b>'+t1(Math.abs(t.sq))+' t</b> over 60 years'):'')+
     (t.st?(' and retained ecosystems already hold <b>'+t1(Math.abs(t.st))+' t</b>'):'')+
     '. Net <b>'+(net>0?'+':'')+t1(net)+' t</b> \u2014 <b>'+perLabel(per)+'</b>. '+
     (ny!=null?('The cumulative curve crosses zero in <b>year '+ny+'</b>.')
              :'The cumulative curve does not cross zero within 60 years.')+'</div></div>';

  h+='<p class="note">Embodied carbon is the one-off emission from producing, transporting and '+
     'installing the materials. Sequestration is what the planting takes back over the study '+
     'period. The two are counted on one timeline, and the year the running total reaches zero '+
     'is the break-even year.</p>';

  h+='<div class="kpis" style="margin-top:16px">'+
     '<div class="kpi"><div class="k">EMBODIED</div><div class="v">'+t1(t.me)+' t</div>'+
       '<div class="r">'+t1(t.lo)+'\u2013'+t1(t.hi)+' t range</div></div>'+
     '<div class="kpi"><div class="k">NET, 60 YR</div><div class="v">'+(net>0?'+':'')+t1(net)+' t</div>'+
       '<div class="r">'+perLabel(t.area>0?t.me/t.area:0)+'</div></div></div>';

  h+='<div class="sec" style="margin-top:20px"><div class="sechead"><span class="l">Schedule</span>'+
     '<span class="r">median \u00b7 t CO\u2082e</span></div>';
  MODEL.groups.forEach(function(cg){
    var ref=priced(cg); if(!ref) return;
    var r=resolve(cg), c=carbon(r), kind=groupKind(cg);
    var name=r.material?r.material:((CC.landuses[ref]||{}).n||ref);
    var basis=kind==='solid'?fmtV(cg.qty.volume):fmtA(cg.qty.surfArea);
    h+='<div class="itemrow" style="cursor:default">'+
       '<span><span class="nm">'+esc(String(name).slice(0,42))+'</span>'+
       '<span class="q" style="display:block">'+cg.color+' \u00b7 '+basis+'</span></span>'+
       '<span class="v"'+(c.me<0?' style="color:var(--green)"':'')+'>'+t1(c.me)+'</span></div>';
  });
  h+='</div>';

  h+='<div class="sec"><div class="sechead"><span class="l">Where these numbers come from</span>'+
     '<span class="r">share of carbon</span></div>'+
     '<div class="stack" style="margin-top:9px">'+
       (pc('m')?'<span style="width:'+pc('m')+'%;background:var(--accent)"></span>':'')+
       (pc('a')?'<span style="width:'+pc('a')+'%;background:var(--ochre)"></span>':'')+
       (pc('o')?'<span style="width:'+pc('o')+'%;background:var(--green)"></span>':'')+
     '</div><div class="keys">'+
       '<div><span class="pv m">'+PVN.m+'</span> '+pcLabel('m')+' \u00b7 '+prov.m+' items</div>'+
       '<div><span class="pv a">'+PVN.a+'</span> '+pcLabel('a')+' \u00b7 '+prov.a+' items</div>'+
       (prov.o?('<div><span class="pv ok">'+PVN.o+'</span> '+pcLabel('o')+' \u00b7 '+prov.o+' items</div>'):'')+
     '</div>'+
     '<p class="note">The <b>Reference</b> share is scaled from published assemblies in '+DATASET+
     ' rather than taken off your model. Modelling those elements in Rhino moves them to Measured.</p></div>';

  h+='<div class="sec"><div class="sechead"><span class="l">Scope</span></div>'+
     '<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px">'+
     [['Material production A1\u2013A3',1],
      ['Transport to site A4',1],
      ['Installation A5',1],
      ['Plant and soil sequestration, 60 yr',1],
      ['Carbon stored in retained ecosystems',1],
      ['Maintenance B2\u2013B3 (irrigation, mowing)',0],
      ['End-of-life C',0]].map(function(r){
       return '<tr><td style="padding:5px 0;border-bottom:1px solid var(--line)">'+r[0]+'</td>'+
         '<td style="padding:5px 0;border-bottom:1px solid var(--line);text-align:right">'+
         (r[1]?'<span class="pv ok">included</span>':'<span class="pv no">excluded</span>')+'</td></tr>';
     }).join('')+'</table>'+
     '<p class="note">Maintenance and end-of-life are excluded because '+DATASET+
     ' carries no factors for either stage.</p></div>';

  var asm=assumptionList();
  if(asm)
    h+='<div class="sec"><div class="sechead"><span class="l">Assumptions</span>'+
       '<span class="r">largest first</span></div>'+asm+'</div>';

  h+='<div class="sec"><div class="sechead"><span class="l">Reading the charts</span></div>'+
     '<p class="note">The pale extension on each bar is the range to the high carbon factor. '+
     'It is not an error bar. The low end is what this same design reaches if the low-carbon '+
     'option is taken everywhere, which makes it a target rather than a disclaimer.</p>'+
     '<p class="note">No \u201Cdo nothing\u201D baseline is drawn on the sixty-year curve. '+
     'It requires the existing-condition account, which is not built. Without it the area '+
     'between the two curves \u2014 the design\u2019s true cost against leaving the site alone '+
     '\u2014 cannot honestly be shown.</p></div>';

  h+='<p class="note" style="margin-top:18px">Carbon factors: Hardy, C. &amp; Frechette, M. (2023). '+
     '<i>Designing with a Carbon Conscience V2</i>. Sasaki Associates. CC BY-NC 4.0.</p>';

  return h+'</div>';
}
