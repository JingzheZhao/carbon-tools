/* Three readings of the same geometry: as Rhino coloured it, by carbon, by
   cost. Carbon and cost shade by each group's share of the site total, so the
   map answers "where is it concentrated" rather than "what is dense". */
var MATS={};
var PALETTES=[
  /* Stops run low -> high, so the pale end is the small number and the dark end
     the large one. Storing them this way means the ramp, the swatches and the
     exported image all read the same direction without any of them reversing. */
  {id:'magma',  name:'Magma',   c:['#fbdf8f','#f0813a','#c33d55','#6a2b6e','#241a38']},
  {id:'viridis',name:'Viridis', c:['#fde725','#5ec962','#21918c','#3b528b','#440154']},
  {id:'inferno',name:'Inferno', c:['#fcffa4','#f98e09','#bc3754','#57106e','#0b0417']},
  {id:'plasma', name:'Plasma',  c:['#f0f921','#fca636','#e16462','#b12a90','#3b049a']},
  {id:'cividis',name:'Cividis', c:['#fdea45','#a09073','#666970','#31446b','#00204d']},
  {id:'ember',  name:'Ember',   c:['#ffd980','#f0883b','#c1440e','#5c1a3a','#14121f']},
  {id:'teal',   name:'Teal',    c:['#d7f2ec','#67c9bc','#1f8a80','#0f4b47','#08201f']},
  {id:'ocean',  name:'Ocean',   c:['#eaf4fb','#9ecae1','#3182bd','#1c4f8c','#0a2540']},
  {id:'forest', name:'Forest',  c:['#f7fcb9','#c2e699','#78c679','#31a354','#00441b']},
  {id:'slate',  name:'Slate',   c:['#e6ecf1','#b3c0cc','#77899b','#40536a','#101820']}
];
function palette(){
  var p=PALETTES.filter(function(x){return x.id===UI.pal;})[0];
  return (p||PALETTES[0]).c;
}
function heatAt(t){
  t=Math.max(0,Math.min(1,t));
  var HEAT=palette();
  var n=HEAT.length-1, i=Math.min(n-1,Math.floor(t*n)), f=t*n-i;
  function ch(h,k){return parseInt(h.slice(1+k*2,3+k*2),16);}
  var a=HEAT[i], b=HEAT[i+1], out='#';
  for(var k=0;k<3;k++){
    var v=Math.round(ch(a,k)+(ch(b,k)-ch(a,k))*f).toString(16);
    out += v.length<2?'0'+v:v;
  }
  return out;
}
function groupValue(cg, mode){
  if(mode==='carbon') return Math.abs(carbon(resolve(cg)).me);
  if(mode==='cost'){
    var r=RATE[cg.color];
    if(r==null||r==='') return 0;
    return Math.abs(Number(r)*(groupKind(cg)==='solid'?cg.qty.volume:cg.qty.surfArea));
  }
  return 0;
}
function applyMode(){
  var mode=UI.mode, vals={}, live=[];
  MODEL.groups.forEach(function(cg){
    var v=groupValue(cg,mode);
    vals[cg.color]=v;
    if(v>0) live.push(v);            // a group with no material is absent, not zero
  });
  var any=live.length>0;
  var lo=any?Math.floor(Math.min.apply(null,live)):0;
  var hi=any?Math.ceil (Math.max.apply(null,live)):0;
  if(hi<=lo) hi=lo+1;                // a single group, or every group equal
  MODEL.groups.forEach(function(cg){
    var m=MATS[cg.color];
    if(!m) return;
    if(mode==='colour'||!any||vals[cg.color]<=0) m.color.set(cg.color);
    else m.color.set(heatAt((vals[cg.color]-lo)/(hi-lo)));
  });
  drawModeBar(vals,lo,hi,any);
}
function drawModeBar(vals,lo,hi,any){
  var modes=[{id:'colour',name:'Colour'},{id:'carbon',name:'Carbon'},{id:'cost',name:'Cost'}];
  $('#modeSeg').innerHTML=modes.map(function(m){
    return '<button data-mode="'+m.id+'" aria-pressed="'+(UI.mode===m.id)+'">'+m.name+'</button>';
  }).join('');
  $('#modeSeg').querySelectorAll('[data-mode]').forEach(function(b){
    b.onclick=function(){ UI.mode=b.dataset.mode; paint(true); };
  });
  var ramp=$('#ramp');
  // a background poll must not raise the ramp back over an open comparison
  if(UI.cmp||UI.rep||UI.mode==='colour'){ ramp.hidden=true; return; }
  ramp.hidden=false;
  if(!any){
    ramp.innerHTML='<div class="dm-note">'+(UI.mode==='cost'
      ? 'No rates entered \u2014 add one under a colour group'
      : 'Nothing assigned yet')+'</div>';
    return;
  }
  var cost=(UI.mode==='cost');
  var fmt=function(v,round){
    var n=cost?(v||0):(v||0)/1000;
    n=round(n);
    return (cost?'$ ':'')+n.toLocaleString('en-US')+(cost?'':' t');
  };
  // only the two ends are labelled — the ramp is read by position, not by
  // matching a group against a list of numbers
  var ticks=MODEL.groups.map(function(cg){ return vals[cg.color]; })
    .filter(function(v){ return v>0; })
    .sort(function(a,b){ return a-b; });
  var hiTxt=fmt(ticks[ticks.length-1],Math.ceil),
      loTxt=(ticks.length>1)?fmt(ticks[0],Math.floor):'';
  lastScale={hi:hiTxt, lo:loTxt};
  var html='<span class="dm-lab dm-hi">'+esc(hiTxt)+'</span>';
  if(loTxt) html+='<span class="dm-lab dm-lo">'+esc(loTxt)+'</span>';
  ramp.innerHTML='<div class="dm-grad" style="background:linear-gradient(to top,'+palette().join(',')+')"></div>'+
    '<div class="dm-scale">'+html+'</div>';
}


/* Right-hand toolbar. Everything here changes how the model is *looked at*,
   never what it is worth - the numbers are the panel's job. */

/* A scheme is every choice that moves the totals: what each colour is made of,
   what it costs, and the climate the assemblies are read against. The geometry
   is deliberately not part of it - the point is to hold the model still and
   vary the specification. */
/* SCHEMES and persistSchemes belong to the project store above: a scheme is
   written into the open project's folder, one file each. */
function thumbnail(){
  /* A scheme keeps a picture of what it was, because four columns of numbers do
     not tell you which design you are looking at. 320px wide is enough to
     recognise a scheme and small enough to sit beside it in storage.

     The shot is always taken from the same framed axonometric, never from the
     working camera. Thumbnails from different angles cannot be compared - a
     scheme reads as smaller when only the camera moved, and a panned view cuts
     the model in half. The camera is put back before the frame is presented, so
     none of this is visible. */
  var pos=camera.position.clone(),
      up=camera.up.clone(),
      target=controls.target.clone();
  try{
    frameView('axo');
    renderer.render(scene,camera);
    var srcC=renderer.domElement, W=320, H=Math.round(W*srcC.height/srcC.width);
    var c=document.createElement('canvas');
    c.width=W; c.height=H;
    var g=c.getContext('2d');
    g.fillStyle=(UI.theme==='dark')?'#1e2732':'#ffffff';
    g.fillRect(0,0,W,H);
    g.drawImage(srcC,0,0,W,H);
    return c.toDataURL('image/jpeg',0.72);
  }catch(e){ return null; }
  finally{
    camera.position.copy(pos);
    camera.up.copy(up);
    controls.target.copy(target);
    controls.update();
    renderer.render(scene,camera);
  }
}

/* A saved scheme is a finished reading, not a recipe. It carries its own rows,
   its own totals and its own picture, so the comparison never re-runs it against
   whatever geometry happens to be in Rhino now. Nothing loads a scheme back into
   the model: changing a material makes a new scheme, it does not edit one. */
function captureScheme(name){
  var st=siteTotals();
  return {id:String(Date.now()), name:name, ts:new Date().toISOString(),
          shot:thumbnail(),
          rows:JSON.parse(JSON.stringify(resRows())),
          tot:{lo:st.lo, me:st.me, hi:st.hi, sq:st.sq, st:st.st,
               area:st.area, cost:st.cost, anyCost:st.anyCost}};
}
function saveSchemeNamed(name){
  SCHEMES.push(captureScheme(name));
  if(!BASELINE) BASELINE=SCHEMES[0].id;
  persistSchemes();
  paint(true);
}
function deleteScheme(id){
  // persistSchemes writes what remains and deletes the file of what does not,
  // so removing the entry is the whole of the deletion
  SCHEMES=SCHEMES.filter(function(s){ return s.id!==id; });
  if(BASELINE===id) BASELINE=SCHEMES.length?SCHEMES[0].id:null;
  persistSchemes();
  drawCompare();
  paint(true);
}

/* Four schemes get their own hue, validated for colour-vision deficiency on
   both themes. A fifth is never given a generated colour - it draws neutral and
   is read by the label at the end of its line. */
var SCHEME_COLOURS=['#0072B2','#D55E00','#009E73','#9B4F7D'];
function schemeColour(i){ return i<SCHEME_COLOURS.length?SCHEME_COLOURS[i]:'var(--dim)'; }
var BASELINE=null;


/* -- comparison -------------------------------------------------------------
   Every saved scheme side by side. The charts are the ones the Result tab
   draws, fed each scheme's own stored rows, so a column reads exactly as that
   scheme read when it was saved. Each keeps its own scale, as it does there:
   the figure beside every bar is what carries across columns, not the length. */
function compareCurve(list){
  /* One chart, several series - here a shared scale is the whole point, since
     these curves are only worth anything drawn against each other. */
  var series=list.map(function(sc,i){
    var y0=sc.tot.me+sc.tot.st, cv=curve(sc.tot.sq,80), pts=[];
    for(var y=0;y<=60;y++) pts.push(y0+cv[y]);
    var be=null;
    for(var k=1;k<=60;k++) if(pts[k-1]>0&&pts[k]<=0){ be=k-1+pts[k-1]/(pts[k-1]-pts[k]); break; }
    return {sc:sc, c:schemeColour(i), pts:pts, be:be};
  });
  var top=-Infinity, bot=Infinity;
  series.forEach(function(o){ o.pts.forEach(function(v){ if(v>top)top=v; if(v<bot)bot=v; }); });
  if(top<0) top=0;
  if(bot>0) bot=0;
  var span=(top-bot)||1, pad=4;
  var X=function(y){ return (y/60)*100; };
  var Y=function(v){ return pad+((top-v)/span)*(100-pad*2); };

  var grid='', ticks='';
  [0,15,30,45,60].forEach(function(y){
    var x=X(y).toFixed(2);
    grid+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="100" stroke="var(--line)" '+
          'stroke-width="1" vector-effect="non-scaling-stroke"/>';
    ticks+='<span style="'+(y===0?'left:0;transform:none'
                          :y===60?'right:0;left:auto;transform:none'
                                 :'left:'+x+'%')+'">'+y+'</span>';
  });
  var zy=Y(0);
  var yax='<span style="top:'+Y(top).toFixed(2)+'%">'+t1(top)+'</span>';
  if(zy>Y(top)+9 && zy<Y(bot)-9) yax+='<span class="z" style="top:'+zy.toFixed(2)+'%">0</span>';
  yax+='<span style="top:'+Y(bot).toFixed(2)+'%">'+t1(bot)+'</span>';

  var paths='';
  series.forEach(function(o){
    var d=o.pts.map(function(v,y){ return (y?'L':'M')+X(y).toFixed(2)+' '+Y(v).toFixed(2); }).join(' ');
    if(o.be!=null)
      paths+='<line x1="'+X(o.be).toFixed(2)+'" y1="0" x2="'+X(o.be).toFixed(2)+'" y2="100" '+
             'stroke="'+o.c+'" stroke-width="1" opacity=".5" vector-effect="non-scaling-stroke"/>';
    paths+='<path d="'+d+'" fill="none" stroke="'+o.c+'" stroke-width="3" '+
           'vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
  });

  /* Colour never names a line on its own - four hues is the validated limit and
     a reader with a colour-vision deficiency needs the words regardless. The key
     sits under the plot rather than on it: labels at the line ends land exactly
     where the curves converge, which is the part worth reading. */
  var key=series.map(function(o){
    return '<span class="cmpKeyItem">'+
           '<b style="color:'+o.c+'">'+esc(o.sc.name)+'</b>'+
           '<em>'+(o.be!=null?'break-even yr '+Math.round(o.be):'no break-even')+'</em></span>';
  }).join('');

  return '<div class="rs-card"><div class="rs-cardH">'+
         '<span class="t">Cumulative Net Carbon</span>'+
         '<span class="u">t CO\u2082e \u00b7 60 yr \u00b7 '+series.length+' schemes</span></div>'+
         '<div class="rs-body"><div class="rs-chart">'+
         '<div class="rs-yax">'+yax+'</div><div class="rs-plotcol">'+
         '<svg class="rs-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+
         grid+
         '<line x1="0" y1="'+zy.toFixed(2)+'" x2="100" y2="'+zy.toFixed(2)+'" '+
           'stroke="var(--sub)" stroke-width="1" opacity=".55" vector-effect="non-scaling-stroke"/>'+
         paths+'</svg><div class="rs-ticks">'+ticks+'</div></div></div>'+
         '<div class="cmpKey">'+key+'</div></div></div>';
}

function deltaSpan(v, base){
  if(base==null || base===0 || v==null) return '';
  var d=((v-base)/Math.abs(base))*100;
  if(Math.abs(d)<0.5) return '<span class="cmpDlt">\u00b7</span>';
  return '<span class="cmpDlt '+(d>0?'up':'dn')+'">'+(d>0?'+':'\u2212')+
         Math.abs(d).toFixed(0)+'%</span>';
}

function compareView(){
  var h='<div class="cmpH"><span class="t">Comparison</span>'+
        '<span class="n">'+SCHEMES.length+' scheme'+(SCHEMES.length===1?'':'s')+'</span>'+
        '<button class="cmpX" id="cmpClose" title="Close">\u00d7</button></div>';
  if(!SCHEMES.length)
    return h+'<div class="cmpEmpty">Nothing saved yet.<br>'+
             'Set the materials you want, then save the scheme at the foot of the '+
             '<b>Result</b> tab.<br>Change a material and save again - that is a '+
             'second scheme, not an edit to the first.</div>';

  var base=SCHEMES.filter(function(s){ return s.id===BASELINE; })[0]||SCHEMES[0];

  /* A grid rather than a stack of columns: the same chart lands on the same row
     in every scheme, and a row is as tall as the tallest thing in it. A scheme
     with nothing to say in one account gets an empty cell, not a shifted one. */
  h+='<div class="cmpBody">'+compareCurve(SCHEMES)+
     '<div class="cmpPanel"><div class="cmpCols">';
  SCHEMES.forEach(function(sc,i){
    var isBase=(sc.id===base.id), sep=i?' sep':'';
    var cell=function(inner, extra){
      return '<div class="cmpCell'+sep+(extra||'')+'">'+inner+'</div>';
    };
    h+=cell('<div class="cmpColH'+(isBase?' base':'')+'">'+
       '<button class="cmpPick" data-base="'+sc.id+'" aria-pressed="'+isBase+'" '+
         'title="Read every other scheme against this one">'+
         '<span class="nm" style="color:'+schemeColour(i)+'">'+esc(sc.name)+'</span>'+
         (isBase?'<span class="tag">BASELINE</span>':'')+'</button>'+
       '<button class="del" data-delsc="'+sc.id+'" title="Delete this scheme">\u00d7</button>'+
       '</div>'+
       '<div class="cmpMeta"><span>'+esc(String(sc.ts).slice(0,10))+'</span>'+
       '<span>'+t1(sc.tot.me)+' t '+(isBase?'':deltaSpan(sc.tot.me, base.tot.me))+'</span>'+
       '<span>'+(sc.tot.anyCost?money(sc.tot.cost):'\u2212')+' '+
         (isBase||!sc.tot.anyCost||!base.tot.anyCost?'':deltaSpan(sc.tot.cost, base.tot.cost))+
       '</span></div>', ' head');
    h+=cell(sc.shot?('<img class="cmpShot" src="'+sc.shot+'" alt="">'):'');
    h+=cell(colourKey(sc.rows));
    ACCOUNTS.forEach(function(a){ h+=cell(accountChart(sc.rows,a.k)); });
    h+=cell(accountChart(sc.rows,'cost'));
  });
  return h+'</div></div></div>';
}

/* The browser writes the PDF. Its print dialog is also the path picker: "Save
   as PDF" opens the system save dialog, so there is nothing for this code to
   choose. Renaming the document first is the only thing worth doing - the
   browser offers document.title as the filename, and "Sitewise" is a worse
   suggestion than the project and the date. */
function exportReport(){
  var was=document.title;
  document.title=(PROJECT||'Sitewise')+' - carbon report - '+
                 new Date().toISOString().slice(0,10);
  var restore=function(){
    document.title=was;
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore);
  window.print();
  setTimeout(restore, 1000);   // afterprint is not fired everywhere
}

/* Report: the same overlay frame as the comparison, holding the document the
   Report tab used to render in the side panel. */

      '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" '+
        'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+
      '<path d="M12 3v11m0 0 4-4m-4 4-4-4"/><path d="M4 17v2.5h16V17"/></svg>'+

function drawCompare(){

document.addEventListener('click',function(e){
  if(UI.pop && !e.target.closest('#toolbar')){ UI.pop=null; drawToolbar(); }
});

/* The viewport is saved with its legend drawn in, so the file still means
   something once it is out of the app and in a report. The DOM panel is not
   part of the image - a WebGL canvas is all the browser can hand over without
   an external rasteriser. */
function saveImage(){
  renderer.render(scene,camera);
  var src=renderer.domElement;
  var c=document.createElement('canvas');
  c.width=src.width; c.height=src.height;
  var g=c.getContext('2d');
  g.fillStyle=(UI.theme==='dark')?'#1e2732':'#ffffff';
  g.fillRect(0,0,c.width,c.height);
  g.drawImage(src,0,0);

  if(UI.mode!=='colour'){
    var k=c.width/window.innerWidth;          // device pixel ratio
    var x=46*k, bot=c.height-70*k, h=210*k, w=9*k;
    var grad=g.createLinearGradient(0,bot,0,bot-h);
    var cols=palette();
    cols.forEach(function(col,i){ grad.addColorStop(i/(cols.length-1),col); });
    var r=w/2;
    g.fillStyle=grad;
    g.beginPath();
    if(g.roundRect) g.roundRect(x,bot-h,w,h,r); else g.rect(x,bot-h,w,h);
    g.fill();

    var lab=lastScale;
    g.fillStyle=(UI.theme==='dark')?'#9dadba':'#54636f';
    g.font=(10.5*k)+'px ui-monospace, Menlo, Consolas, monospace';
    g.textAlign='left';
    if(lab){
      g.textBaseline='top';    g.fillText(lab.hi, x+w+7*k, bot-h);
      g.textBaseline='bottom'; g.fillText(lab.lo, x+w+7*k, bot);
    }
  }

  var a=document.createElement('a');
  a.download='carbon-'+UI.mode+'-'+new Date().toISOString().slice(0,10)+'.png';
  a.href=c.toDataURL('image/png');
  a.click();
}
var lastScale=null;

function drawTabs(){
  $('#tabs').innerHTML=VIEWS.map(function(v){
    return '<button data-view="'+v.id+'" aria-pressed="'+(UI.tab===v.id)+'">'+v.name+'</button>';
  }).join('');
  $('#tabs').querySelectorAll('[data-view]').forEach(function(b){
    b.onclick=function(){ UI.tab=b.dataset.view; paint(true); };
  });
}

function paint(force){
  // A background poll must never tear out an open dropdown or a half-typed rate.
  // A change the user just committed must redraw at once — hence force.
  if(!force && panelBusy()){ paintPending=true; return; }
  paintPending=false;
  document.documentElement.dataset.t=UI.theme;
  syncTheme();                       // keep the sun/moon highlight on the active theme
  var dark=(UI.theme==='dark');
  // documentElement.dataset.t was set above, so the tokens already hold the
  // colours of the theme being painted
  scene.background=new THREE.Color(themeColor('--scene'));
  scene.remove(grid);
  grid = new THREE.GridHelper(200, 40, themeColor('--grid1'), themeColor('--grid2'));
  grid.visible = UI.grid;
  scene.add(grid);
  drawTabs();
  drawSelects();
  drawToolbar();
  applyMode();
  $('#panelBody').innerHTML = UI.tab==='mat' ? matTab() : resTab();
  if(UI.tab==='mat') wire();
  // the Result tab has its own collapsibles, and wire() never runs there
  document.querySelectorAll('[data-res]').forEach(function(b){
    b.onclick=function(){ UI.res[b.dataset.res]=!UI.res[b.dataset.res]; paint(true); };
  });
  var sn=$('#cmpName'), sb=$('#cmpSave');
  if(sb){
    var saveSc=function(){
      saveSchemeNamed((sn.value||'').trim() || ('Scheme '+(SCHEMES.length+1)));
    };
    sb.onclick=saveSc;
    sn.onkeydown=function(e){ if(e.key==='Enter') saveSc(); };
  }


  var st=siteTotals();

  var mt=MODEL.meta, warn=$('#unitWarn');
  if(warn){
    // only speaks up when the document has no unit system, which makes every
    // number wrong by an unknown factor
    var bad = mt && mt.units_trusted===false;
    warn.hidden = !bad;
    if(bad) warn.textContent='Rhino document has no unit system. Values are unscaled \u2014 set the model units in Rhino.';
  }
}

function wire(){
  document.querySelectorAll('[data-pick]').forEach(function(b){
    b.onclick=function(){
      UI.picker=(UI.picker===b.dataset.pick)?null:b.dataset.pick;
      paint(true);
      var inp=document.querySelector('[data-search]');
      if(inp) inp.focus();
    };
  });
  document.querySelectorAll('[data-opt]').forEach(function(b){
    b.onclick=function(){
      ASSIGN[b.dataset.col]=b.dataset.opt;
      UI.picker=null;
      paint(true);
    };
  });
  document.querySelectorAll('[data-search]').forEach(function(inp){
    inp.onkeydown=function(e){ if(e.key==='Escape'){ UI.picker=null; paint(true); } };
    inp.oninput=function(){                      // filter in place — never repaints
      var q=inp.value.trim().toLowerCase();
      var box=document.querySelector('[data-list="'+inp.dataset.search+'"]');
      if(!box) return;
      var seen={};
      box.querySelectorAll('[data-opt]').forEach(function(o){
        var hit=!q||o.dataset.t.indexOf(q)>=0;
        o.style.display=hit?'':'none';
        if(hit){
          var g=o.previousElementSibling;
          while(g&&!g.classList.contains('pickgroup')) g=g.previousElementSibling;
          if(g) seen[g.dataset.g]=true;
        }
      });
      box.querySelectorAll('.pickgroup').forEach(function(g){
        g.style.display=seen[g.dataset.g]?'':'none';
      });
    };
  });
  document.querySelectorAll('[data-exp]').forEach(function(b){
    b.onclick=function(){ UI.open[b.dataset.exp]=!UI.open[b.dataset.exp]; paint(); };
  });
  document.querySelectorAll('[data-k]').forEach(function(b){
    b.onclick=function(){ UI.open[b.dataset.k]=!UI.open[b.dataset.k]; paint(); };
  });
  document.querySelectorAll('[data-vis]').forEach(function(b){
    b.onclick=function(){ var c=b.dataset.vis; VIS[c]=(VIS[c]===false); applyVis(); paint(); };
  });
  document.querySelectorAll('[data-iso]').forEach(function(b){
    b.onclick=function(){ var c=b.dataset.iso;
      MODEL.groups.forEach(function(g){ VIS[g.color]=(g.color===c); });
      applyVis(); paint(); };
  });
  document.querySelectorAll('[data-cost]').forEach(function(inp){
    inp.oninput=function(e){                       // in-place: a redraw would steal focus
      var c=inp.dataset.cost, val=e.target.value;
      var g=MODEL.groups.filter(function(x){return x.color===c;})[0];
      var solid=g?groupKind(g)==='solid':false;
      RATE[c]=rateToCanonical(val,solid);    // canonical: $/m2 for area, $/m3 for volume
      var A=g?(solid?g.qty.volume:g.qty.surfArea):0;
      var cell=document.getElementById('ct-'+c.slice(1));
      if(cell){ cell.textContent=costLabel(RATE[c],A); }
    };
  });
}
/* Click-away, the same as the toolbar popovers and the account menu above: the
   button and the list are siblings rather than one element, so both are named. */
document.addEventListener('click',function(e){
  if(UI.picker && !e.target.closest('.pick,.pickbox')){ UI.picker=null; paint(true); }
});
function applyVis(){
  contentGroup.children.forEach(function(ch){
    ch.visible = VIS[ch.userData.groupColor]!==false;
  });
}

/* The same geometry wired into two CC Group components arrives under two
   colours, and anything priced on both sides lands in the total twice. Nothing
   on a colour card shows it, so the payload is scanned for it directly: every
   object carries a content hash, and an id that turns up under more than one
   colour is the same object arriving more than once. */
function findDuplicates(groups){
  var seen={};
  groups.forEach(function(g){
    (g.objects||[]).forEach(function(o){
      if(!o.id) return;
      var e=seen[o.id]||(seen[o.id]={colors:[],q:o.quantity||{}});
      e.colors.push(g.color);
    });
  });
  var combos={}, total=0;
  Object.keys(seen).forEach(function(id){
    var e=seen[id];
    if(e.colors.length<2) return;      // once is what we expect
    total++;
    var uniq=e.colors.filter(function(c,i){ return e.colors.indexOf(c)===i; }).sort();
    var key=uniq.length>1 ? uniq.join(' + ') : uniq[0]+' (twice in one group)';
    var c=combos[key]||(combos[key]={count:0,area:0,volume:0});
    c.count++; c.area+=e.q.area||0; c.volume+=e.q.volume||0;
  });
  return total ? {total:total, combos:combos} : null;
}

/* ── ingest one sync payload ── */
var firstLoad=true;
function ingest(data){
  contentGroup.clear();
  MODEL.meta=data.meta;
  MODEL.dupes=findDuplicates(data.groups||[]);
  MODEL.groups=(data.groups||[]).map(function(group){
    var color=new THREE.Color(group.color);
    var material=new THREE.MeshStandardMaterial({color:color,side:THREE.DoubleSide});
    MATS[group.color]=material;
    /* solids and surfaces are tallied separately — the plugin already tells
       them apart by whether it could compute a volume */
    var q={area:0,surfArea:0,volume:0,count:0,length:0,solids:0,surfaces:0};
    group.objects.forEach(function(obj){
      q.count++;
      var Q=obj.quantity||{};
      var vol=Q.volume||0;
      q.area+=Q.area||0; q.length+=Q.length||0;
      if(vol>0){ q.volume+=vol; q.solids++; }
      else { q.surfArea+=Q.area||0; q.surfaces++; }
      if(obj.mesh&&obj.mesh.vertices&&obj.mesh.vertices.length&&obj.mesh.faces){
        var mesh=new THREE.Mesh(buildGeometry(obj.mesh),material);
        mesh.userData.groupColor=group.color;
        contentGroup.add(mesh);
      }
    });
    return {color:group.color, label:group.name||null, qty:q};
  });
  applyVis();
  if(firstLoad && contentGroup.children.length>0){ frameView('axo'); firstLoad=false; }
  paint();
}

var lastRaw=null;
function syncFault(msg){
  $('#panelBody').innerHTML='<div class="empty">'+esc(msg)+'</div>';
}
function poll(){
  fetch('/data.json',{cache:'no-store'})
    .then(function(r){return r.text();})
    .catch(function(){ return null; })   // server gone: stay quiet, keep polling
    .then(function(txt){
      if(txt===null || txt===lastRaw) return;   // nothing new — leave the DOM alone
      try{
        var data=JSON.parse(txt);
        /* A page left open across a plugin upgrade would otherwise read the new
           flat arrays with the old nested reader and draw nothing at all. */
        if(data.meta && data.meta.mesh_format!==2){
          syncFault('This page is older than the plugin sending the data. '+
                    'Reload the page to update it.');
          lastRaw=txt;
          return;
        }
        ingest(data);
        lastRaw=txt;   // only once it is actually on screen
      }catch(err){
        /* Do not set lastRaw: the next tick retries rather than sitting on a
           cleared scene forever. */
        console.error('sync payload could not be read', err, txt&&txt.slice(0,400));
        syncFault('The sync data could not be read: '+(err&&err.message||err)+
                  '  See the browser console for the payload.');
      }
    })
    .then(function(){ setTimeout(poll,1500); });
}

document.addEventListener('focusout',function(){
  setTimeout(function(){ if(paintPending&&!panelBusy()) paint(); },0);
});
/* view switching lives on the tabs — see drawTabs() */


document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  if(UI.cmp){ UI.cmp=false; drawCompare(); drawToolbar(); }
  if(UI.rep){ UI.rep=false; drawReport(); drawToolbar(); }
  if(UI.picker){ UI.picker=null; paint(true); }
});
function syncTheme(){
  document.querySelectorAll('[data-theme-set]').forEach(function(b){
    b.setAttribute('aria-pressed', String(UI.theme===b.dataset.themeSet));
    b.onclick=function(){ UI.theme=b.dataset.themeSet; paint(true); };
  });
}
syncTheme();
/* Wired here rather than beside the project store: `$` is assigned further
   down the file, so binding earlier silently left the buttons dead. */
function initWelcome(){
  function attempt(run){
    welError('');
    run().then(function(res){
      if(res && !res.ok && !cancelled(res)) welError(res.error||'Something went wrong.');
      if(res && res.ok) loadRecent();
    }).catch(function(e){ welError('The plugin did not answer: '+(e&&e.message||e)); });
  }
  $('#welNew').onclick=function(){ attempt(createProject); };
  $('#welOpen').onclick=function(){ attempt(openProject); };
  loadRecent().then(drawWelcome);
}
initWelcome();
paint();
poll();
</script>
